<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QE Scrim | Dashboard</title>
<meta name="theme-color" content="#0a0a0f">
<script>
  if (localStorage.getItem('qe_theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/logo-transparent.png">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { display: ['"Rajdhani"','sans-serif'], body: ['"Inter"','"Hind Siliguri"','sans-serif'] },
    colors: { qeBg:'#0a0a0f', qeCard:'#131319', qeBorder:'#232330', qeRed:'#c8203d', qeRedDim:'#7a1428' }
  }}
}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html,body { background: #f8fafc; transition: background 0.3s ease; }
  html.dark, html.dark body { background: #0a0a0f; }
  body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
  .disp { font-family: 'Rajdhani', sans-serif; letter-spacing: .02em; }
  .hide-scrollbar::-webkit-scrollbar { display: none; } 
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .cut-card { clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  .cut-card-sm { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  
  .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-color: #e2e8f0; }
  .dark .glass { background: rgba(19,19,25,0.9); border-color: #232330; }
  
  .mesh-lines { background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.05) 0 2px, transparent 2px 26px); }
  .dark .mesh-lines { background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.09) 0 2px, transparent 2px 26px); }
  
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  
  .fade-in { animation: fadeIn .45s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fadeIn { from {opacity: 0; transform: translateY(14px)} to {opacity: 1; transform: translateY(0)} }
  
  .scale-in { animation: scaleIn .25s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes scaleIn { from {opacity: 0; transform: scale(.92)} to {opacity: 1; transform: scale(1)} }
  
  .toast-in { animation: toastIn .3s ease-out forwards; }
  @keyframes toastIn { from {opacity: 0; transform: translateX(110%)} to {opacity: 1; transform: translateX(0)} }
  
  ::selection { background: #c8203d; color: #fff; }
  .rank-1 { background: linear-gradient(135deg,#7a5c00,#d4af37); color: #fff; }
  .rank-2 { background: linear-gradient(135deg,#5c5c5c,#c0c0c0); color: #fff; }
  .rank-3 { background: linear-gradient(135deg,#5c2e0e,#cd7f32); color: #fff; }
</style>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-hidden h-screen">

  <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <img src="/assets/logo-transparent.png" class="w-10 h-10 object-contain shrink-0" alt="QE">
      <div class="min-w-0">
        <h1 class="disp text-xl font-bold text-slate-900 dark:text-white leading-none tracking-wide transition-colors">QE <span class="text-qeRed">SCRIM</span></h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold tracking-widest uppercase transition-colors">Dashboard</p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="themeToggleBtn" class="flex items-center justify-center w-9 h-9 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-300 dark:border-slate-700 active:scale-95 transition-all duration-300">
        <i data-lucide="sun" class="absolute transition-all duration-500 transform scale-0 rotate-90 dark:scale-100 dark:rotate-0 w-4 h-4"></i>
        <i data-lucide="moon" class="absolute transition-all duration-500 transform scale-100 rotate-0 dark:scale-0 dark:-rotate-90 w-4 h-4"></i>
      </button>
      <button id="adminBtn" class="flex items-center gap-1.5 text-xs font-bold text-qeRed bg-qeRed/10 px-3 py-2 rounded-lg border border-qeRed/30 active:scale-95 transition-transform">
        <i data-lucide="shield" class="w-4 h-4"></i> <span id="adminBtnText">Admin</span>
      </button>
    </div>
  </div>
</header>

<div class="w-full glass border-b py-2 shrink-0 transition-colors duration-300">
  <div class="flex items-center justify-center gap-2 text-[11px] text-slate-600 dark:text-slate-400 font-medium">
    <span>Developed by <a href="https://linkedin.com/in/RahatAhmedX" target="_blank" class="text-qeRed font-semibold hover:underline">Rahat</a></span>
    <span class="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
    <a href="https://github.com/Rahat0764" target="_blank" class="font-semibold hover:text-slate-900 dark:hover:text-white flex items-center gap-1 transition-colors">

      GitHub

  </div>

<div id="main-scroll" class="flex-1 overflow-y-auto w-full pb-28 pt-4 px-4 md:px-6 hide-scrollbar">
  <main id="app" class="max-w-6xl mx-auto fade-in"></main>
</div>

<nav class="glass z-40 fixed bottom-0 left-0 w-full border-t pb-safe transition-colors duration-300">
  <div class="max-w-6xl mx-auto flex justify-around items-center h-16 px-1">
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">Dashboard</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="teams"><i data-lucide="swords" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">Teams</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="standings"><i data-lucide="trophy" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">Standings</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="payments"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">Payments</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="activity"><i data-lucide="activity" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">Logs</span></button>
  </div>
</nav>

<div id="modalContainer" class="fixed inset-0 bg-slate-900/60 dark:bg-black/85 z-50 hidden flex justify-center items-center px-4 backdrop-blur-sm overflow-y-auto py-8 transition-colors"></div>
<div id="toast-container" class="fixed top-24 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

let supabase = null;
let activeTab = localStorage.getItem('qe_tab') || 'dashboard';
let adminToken = localStorage.getItem('qe_admin_token') || null;
let isAdmin = !!adminToken;

let data = { teams: [], matches: [], results: [], settings: null, payments: [], logs: [], numbers: [], appSettings: null };
let selectedMatchId = null;

const showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = type==='success' ? 'bg-emerald-600' : (type==='error' ? 'bg-qeRed' : 'bg-slate-800');
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-white ${colors} text-sm font-semibold max-w-xs border border-white/10`;
  t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3200);
};

const copyText = async (text, label) => {
  try {
    await navigator.clipboard.writeText(text);
    showToast(`${label} copied!`);
  } catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); showToast(`${label} copied!`);
  }
};

const showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="bg-white dark:bg-[#131319] w-full max-w-md rounded-2xl p-6 border border-slate-200 dark:border-qeBorder fade-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar text-slate-900 dark:text-white transition-colors">${html}</div>`;
  mc.classList.remove('hidden');
  lucide.createIcons();
  mc.onclick = (e) => { if(e.target === mc) hideModal(); };
};
const hideModal = () => document.getElementById('modalContainer').classList.add('hidden');
window.hideModal = hideModal;

async function api(action, payload) {
  const res = await fetch('/api/admin-write', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken || '' },
    body: JSON.stringify({ action, payload })
  });
  const json = await res.json();
  if(!res.ok){
    if(res.status === 401){ doLogout(); showToast('Session expired, please login again', 'error'); }
    throw new Error(json.error || 'Server error occurred');
  }
  return json;
}

async function loadAll() {
  try {
    const [t, m, r, s, p, l, n, as] = await Promise.all([
      supabase.from('teams').select('*').order('created_at'),
      supabase.from('matches').select('*').order('match_no'),
      supabase.from('match_results').select('*'),
      supabase.from('point_settings').select('*').eq('id',1).single(),
      supabase.from('payments').select('*').order('created_at', { ascending: false }),
      supabase.from('activity_logs').select('*').order('created_at', { ascending: false }).limit(60),
      supabase.from('bkash_numbers').select('*').eq('id',1).single(),
      supabase.from('app_settings').select('*').eq('id',1).single()
    ]);
    data.teams = t.data || []; data.matches = m.data || []; data.results = r.data || [];
    data.settings = s.data || { kill_point_value:1, position_table:{} };
    data.payments = p.data || []; data.logs = l.data || [];
    data.numbers = (n.data && n.data.numbers) || [];
    data.appSettings = as.data || { title: 'QE SCRIM Dashboard', description: 'Manage teams, standings, and payments all in one place.' };
    if(!selectedMatchId && data.matches.length) selectedMatchId = data.matches[data.matches.length-1].id;
  } catch(e) { showToast('Failed to load data', 'error'); }
}

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if(b.dataset.tab === activeTab){ b.classList.add('text-qeRed'); b.classList.remove('text-slate-500', 'dark:text-slate-500'); }
    else { b.classList.remove('text-qeRed'); b.classList.add('text-slate-500', 'dark:text-slate-500'); }
  });
}

function render(){
  const app = document.getElementById('app');
  if(activeTab==='dashboard') app.innerHTML = buildDashboard();
  else if(activeTab==='teams') app.innerHTML = buildTeams();
  else if(activeTab==='standings') app.innerHTML = buildStandings();
  else if(activeTab==='payments') app.innerHTML = buildPayments();
  else if(activeTab==='activity') app.innerHTML = buildActivity();
  lucide.createIcons();
  attachListeners();
  updateNav();
  document.getElementById('adminBtnText').innerText = isAdmin ? 'Logout' : 'Admin';
}

function statCard(label, value, icon, grad){
  return `<div class="cut-card ${grad} p-5 relative overflow-hidden shadow-lg border border-white/10">
    <i data-lucide="${icon}" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/10"></i>
    <span class="text-[10px] font-bold uppercase tracking-widest text-white/80 block mb-1">${label}</span>
    <h3 class="text-3xl font-bold disp text-white relative z-10">${value}</h3>
  </div>`;
}

function buildDashboard(){
  const totalTeams = data.teams.length;
  const totalFund = data.payments.filter(p=>p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0);
  const pendingCount = data.payments.filter(p=>p.status==='pending').length;
  const totalMatches = data.matches.length;

  let html = `<div class="mb-6 cut-card mesh-lines bg-gradient-to-br from-qeRedDim/10 to-white dark:to-qeCard border border-slate-200 dark:border-qeBorder p-6 relative overflow-hidden shadow-sm transition-colors">
    <img src="/assets/logo-transparent.png" class="absolute -right-4 -top-6 w-40 opacity-[0.08] dark:opacity-20 pointer-events-none">
    <div class="flex justify-between items-start relative z-10">
      <div>
        <p class="text-qeRed font-bold text-xs uppercase tracking-widest mb-1">Welcome</p>
        <h2 class="disp text-3xl font-bold text-slate-900 dark:text-white mb-2 transition-colors">${data.appSettings.title}</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400 max-w-md transition-colors">${data.appSettings.description}</p>
        ${isAdmin ? `<p class="mt-2 text-xs text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> Admin Mode Active</p>` : ''}
      </div>
      ${isAdmin ? `<button id="editSettingsBtn" class="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 p-2 rounded-lg active:scale-95"><i data-lucide="edit-3" class="w-4 h-4"></i></button>` : ''}
    </div>
  </div>`;

  html += `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    ${statCard('Total Teams', totalTeams, 'swords', 'bg-gradient-to-br from-indigo-500 to-indigo-700')}
    ${statCard('Total Matches', totalMatches, 'gamepad-2', 'bg-gradient-to-br from-qeRed to-qeRedDim')}
    ${statCard('Total Fund', '৳'+totalFund, 'wallet', 'bg-gradient-to-br from-emerald-500 to-emerald-700')}
    ${statCard('Pending Pay', pendingCount, 'clock', 'bg-gradient-to-br from-amber-500 to-amber-700')}
  </div>`;

  html += `<div class="cut-card bg-white dark:bg-qeCard border border-slate-200 dark:border-qeBorder overflow-hidden shadow-sm transition-colors">
    <div class="p-4 border-b border-slate-200 dark:border-qeBorder flex items-center gap-2 transition-colors"><i data-lucide="activity" class="w-4 h-4 text-qeRed"></i><h3 class="font-bold disp tracking-wide">Recent Activity</h3></div>
    <div class="divide-y divide-slate-100 dark:divide-qeBorder max-h-80 overflow-y-auto hide-scrollbar transition-colors">
      ${data.logs.slice(0,8).map(l=>`
        <div class="p-4 flex gap-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
          <div class="w-8 h-8 rounded-lg bg-qeRed/10 text-qeRed flex items-center justify-center shrink-0"><i data-lucide="bell" class="w-4 h-4"></i></div>
          <div class="min-w-0"><p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${l.action}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${l.details}</p><p class="text-[10px] text-slate-400 dark:text-slate-500 mt-1">${new Date(l.created_at).toLocaleString('en-US')}</p></div>
        </div>`).join('') || '<div class="p-8 text-center text-slate-500 text-sm">No recent activity</div>'}
    </div>
  </div>`;
  return html;
}

function buildTeams(){
  let html = `<div class="flex justify-between items-center mb-5">
    <h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="swords" class="w-6 h-6 text-qeRed"></i> Team Roster</h2>
    ${isAdmin ? `<button id="addTeamBtn" class="bg-qeRed text-white px-3 py-2 rounded-lg text-xs font-bold cut-card-sm active:scale-95 shadow-lg shadow-qeRed/20"><i data-lucide="plus" class="inline w-3 h-3"></i> Add Team</button>` : ''}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

  if(!data.teams.length) html += `<div class="col-span-full p-10 text-center text-slate-500 cut-card bg-white dark:bg-qeCard border border-slate-200 dark:border-qeBorder shadow-sm">No teams added yet.</div>`;

  html += data.teams.map(t=>{
    const main = t.main_players || []; const res = t.reserve_players || [];
    return `<div class="cut-card bg-white dark:bg-qeCard border border-slate-200 dark:border-qeBorder p-5 relative shadow-sm transition-colors">
      ${isAdmin ? `<div class="absolute top-4 right-4 flex gap-2">
        <button class="edit-team-btn p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500 dark:text-slate-400 hover:text-qeRed dark:hover:text-qeRed transition-colors" data-id="${t.id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
        <button class="del-team-btn p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500 dark:text-slate-400 hover:text-qeRed dark:hover:text-qeRed transition-colors" data-id="${t.id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>` : ''}
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-qeRed to-qeRedDim flex items-center justify-center font-bold disp text-xl text-white shadow-md">${(t.slot_no||'?')}</div>
        <div><h3 class="font-bold text-xl disp text-slate-900 dark:text-white">${t.team_name}</h3><p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Slot ${t.slot_no ?? '-'}</p></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-4 text-sm bg-slate-50 dark:bg-black/20 p-3 rounded-lg border border-slate-100 dark:border-white/5">
        <div>
          <p class="text-[10px] font-bold text-emerald-600 dark:text-emerald-500 uppercase mb-1.5 flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i> Main</p>
          ${main.map(p=>`<p class="text-slate-700 dark:text-slate-300 text-xs py-0.5">${p||'-'}</p>`).join('') || '<p class="text-slate-400 text-xs">-</p>'}
        </div>
        <div>
          <p class="text-[10px] font-bold text-amber-600 dark:text-amber-500 uppercase mb-1.5 flex items-center gap-1"><i data-lucide="user-plus" class="w-3 h-3"></i> Reserve</p>
          ${res.map(p=>`<p class="text-slate-700 dark:text-slate-300 text-xs py-0.5">${p||'-'}</p>`).join('') || '<p class="text-slate-400 text-xs">-</p>'}
        </div>
      </div>
      <div class="pt-3 border-t border-slate-200 dark:border-qeBorder flex items-center justify-between transition-colors">
        <div class="min-w-0"><p class="text-xs font-bold text-slate-800 dark:text-slate-300">${t.manager_name || 'No Manager'}</p><p class="text-[10px] text-slate-500">IGN: ${t.manager_ign || '-'}</p></div>
        ${t.manager_contact ? `<button class="copy-btn flex items-center gap-1.5 text-[11px] bg-slate-100 dark:bg-slate-800 px-2.5 py-1.5 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors font-medium" data-copy="${t.manager_contact}" data-label="Contact"><i data-lucide="copy" class="w-3 h-3"></i>${t.manager_contact}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return html + `</div>`;
}

function buildStandings(){
  const matchOptions = data.matches.map(m=>`<option value="${m.id}" ${m.id===selectedMatchId?'selected':''}>${m.match_label || ('Match '+m.match_no)}</option>`).join('');

  const totals = {};
  data.teams.forEach(t=> totals[t.id] = { team:t, pos:0, kill:0, total:0 });
  data.results.forEach(r=>{ if(totals[r.team_id]){ totals[r.team_id].pos += r.position_points||0; totals[r.team_id].kill += r.kill_points||0; totals[r.team_id].total += r.total_points||0; } });
  const overall = Object.values(totals).sort((a,b)=>b.total-a.total);

  let html = `<div class="flex justify-between items-center mb-5 flex-wrap gap-2">
    <h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="trophy" class="w-6 h-6 text-qeRed"></i> Standings</h2>
    ${isAdmin ? `<div class="flex gap-2">
      <button id="addMatchBtn" class="bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-3 py-2 rounded-lg text-xs font-bold cut-card-sm active:scale-95 transition-colors"><i data-lucide="plus" class="inline w-3 h-3"></i> Match</button>
      <button id="pointSettingsBtn" class="bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-3 py-2 rounded-lg text-xs font-bold cut-card-sm active:scale-95 transition-colors"><i data-lucide="settings" class="inline w-3 h-3"></i> Points</button>

function attachListeners(){
  document.querySelectorAll('.copy-btn').forEach(b=> b.addEventListener('click', e=> copyText(e.currentTarget.dataset.copy, e.currentTarget.dataset.label)));

  if(activeTab==='dashboard'){
    document.getElementById('editSettingsBtn')?.addEventListener('click', openAppSettingsModal);
  }

  if(activeTab==='teams'){
    document.getElementById('addTeamBtn')?.addEventListener('click', ()=> openTeamModal(null));
    document.querySelectorAll('.edit-team-btn').forEach(b=> b.addEventListener('click', e=> openTeamModal(data.teams.find(t=>t.id===e.currentTarget.dataset.id))));
    document.querySelectorAll('.del-team-btn').forEach(b=> b.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      confirmModal('Delete Team', 'Are you sure? This will remove all associated results.', async ()=>{
        try{ await api('delete_team',{id}); await loadAll(); hideModal(); render(); showToast('Team deleted'); }
        catch(err){ showToast(err.message,'error'); }
      });
    }));
  }

  if(activeTab==='standings'){
    document.getElementById('matchSelect')?.addEventListener('change', e=>{ selectedMatchId = e.target.value; render(); });
    document.getElementById('addMatchBtn')?.addEventListener('click', openMatchModal);
    document.getElementById('pointSettingsBtn')?.addEventListener('click', openPointSettingsModal);
    document.querySelectorAll('.save-result-btn').forEach(b=> b.addEventListener('click', async e=>{
      const teamId = e.currentTarget.dataset.team;
      const row = e.currentTarget.closest('tr');
      const position = row.querySelector('.res-pos').value;
      const kills = row.querySelector('.res-kill').value;
      try{ await api('upsert_result', { match_id: selectedMatchId, team_id: teamId, position: Number(position), kills: Number(kills) }); await loadAll(); render(); showToast('Result saved'); }
      catch(err){ showToast(err.message,'error'); }
    }));
  }

  if(activeTab==='payments'){
    document.getElementById('autoVerifyBtn')?.addEventListener('click', ()=>submitPayment('auto'));
    document.getElementById('manualVerifyBtn')?.addEventListener('click', ()=>submitPayment('manual'));
    document.getElementById('editNumbersBtn')?.addEventListener('click', openNumbersModal);
    document.querySelectorAll('.approve-pay-btn').forEach(b=> b.addEventListener('click', async e=>{
      try{ await api('approve_payment',{id:e.currentTarget.dataset.id}); await loadAll(); render(); showToast('Payment Approved'); }
      catch(err){ showToast(err.message,'error'); }
    }));
    document.querySelectorAll('.reject-pay-btn').forEach(b=> b.addEventListener('click', async e=>{
      try{ await api('reject_payment',{id:e.currentTarget.dataset.id}); await loadAll(); render(); showToast('Payment Rejected'); }
      catch(err){ showToast(err.message,'error'); }
    }));
  }

  if(activeTab==='activity'){
    document.querySelectorAll('.del-log-btn').forEach(b=> b.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      confirmModal('Delete Log', 'This log will be permanently deleted.', async ()=>{
        try{ await api('delete_log',{id}); await loadAll(); hideModal(); render(); showToast('Log deleted'); }
        catch(err){ showToast(err.message,'error'); }
      });
    }));
  }
}

function confirmModal(title, msg, onConfirm){
  showModal(`
    <div class="text-center mb-5"><div class="w-14 h-14 bg-qeRed/10 text-qeRed rounded-full flex items-center justify-center mx-auto mb-4 scale-in"><i data-lucide="alert-triangle" class="w-7 h-7"></i></div>
    <h3 class="font-bold disp text-xl text-slate-900 dark:text-white mb-2">${title}</h3>
    <p class="text-sm text-slate-500 dark:text-slate-400">${msg}</p></div>
    <div class="flex gap-3"><button id="cm-cancel" class="flex-1 py-3.5 text-sm bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold transition-colors hover:bg-slate-200 dark:hover:bg-slate-700">Cancel</button><button id="cm-ok" class="flex-1 py-3.5 text-sm bg-qeRed text-white rounded-xl font-bold hover:bg-qeRedDim transition-colors shadow-lg shadow-qeRed/20">Confirm</button></div>
  `);
  document.getElementById('cm-cancel').addEventListener('click', hideModal);
  document.getElementById('cm-ok').addEventListener('click', onConfirm);
}

function openAppSettingsModal(){
  showModal(`

          ${[0,1,2,3].map(i=>`<input class="tm-res w-full p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs outline-none text-slate-900 dark:text-white focus:border-amber-500/50 transition-colors" placeholder="Reserve ${i+1}" value="${res[i]||''}">`).join('')}

      <div class="pt-2">
        <p class="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase mb-2">Management</p>
        <div class="space-y-2">
          <input id="tm-mname" placeholder="Manager Name" value="${team?.manager_name||''}" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none text-slate-900 dark:text-white focus:border-qeRed/50">
          <div class="grid grid-cols-2 gap-2">
            <input id="tm-mign" placeholder="Manager IGN" value="${team?.manager_ign||''}" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none text-slate-900 dark:text-white focus:border-qeRed/50">
            <input id="tm-mcontact" placeholder="Contact Number" value="${team?.manager_contact||''}" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none text-slate-900 dark:text-white focus:border-qeRed/50">
          </div>
        </div>
      </div>
    </div>
    <div class="flex gap-3 mt-6"><button id="tm-cancel" class="flex-1 py-3.5 text-sm bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Cancel</button><button id="tm-save" class="flex-1 py-3.5 text-sm bg-qeRed text-white rounded-xl font-bold shadow-lg shadow-qeRed/20 hover:bg-qeRedDim transition-colors">Save Team</button></div>
  `);
  document.getElementById('tm-cancel').addEventListener('click', hideModal);
  document.getElementById('tm-save').addEventListener('click', async ()=>{
    const payload = {
      team_name: document.getElementById('tm-name').value,
      slot_no: Number(document.getElementById('tm-slot').value)||null,
      main_players: Array.from(document.querySelectorAll('.tm-main')).map(i=>i.value),
      reserve_players: Array.from(document.querySelectorAll('.tm-res')).map(i=>i.value),
      manager_name: document.getElementById('tm-mname').value,
      manager_ign: document.getElementById('tm-mign').value,
      manager_contact: document.getElementById('tm-mcontact').value
    };
    if(!payload.team_name) return showToast('Team name is required', 'error');
    try{
      if(team) await api('update_team', { id: team.id, ...payload }); else await api('create_team', payload);
      await loadAll(); hideModal(); render(); showToast('Team saved');
    } catch(err){ showToast(err.message,'error'); }
  });
}

async function submitPayment(method){
  const payer_name = document.getElementById('payName').value;
  const amount = document.getElementById('payAmount').value;
  const team_id = document.getElementById('payTeam').value || null;
  const sender_number = document.getElementById('paySender').value;
  const trx_id = document.getElementById('payTrx').value;
  const file = document.getElementById('payScreenshot').files[0];

  if(!payer_name || !amount) return showToast('Name and amount required', 'error');
  if(method === 'auto' && !trx_id) return showToast('TrxID is required for Auto Verification', 'error');
  if(method === 'auto' && !sender_number) return showToast('Sender Number is required for Auto Verification', 'error');

  const btnText = method === 'auto' ? document.getElementById('autoVerifyBtn').innerHTML : document.getElementById('manualVerifyBtn').innerHTML;
  if(method === 'auto') document.getElementById('autoVerifyBtn').innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Submitting...';
  else document.getElementById('manualVerifyBtn').innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Submitting...';
  lucide.createIcons();

  let screenshot_url = null;
  try {
    if(file){
      const path = `${Date.now()}-${file.name}`.replace(/\s+/g,'_');
      const { error: upErr } = await supabase.storage.from('payment-proofs').upload(path, file);
      if(!upErr){ const { data: pub } = supabase.storage.from('payment-proofs').getPublicUrl(path); screenshot_url = pub.publicUrl; }
    }
    const res = await fetch('/api/payment-submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ team_id, payer_name, amount, trx_id, sender_number, screenshot_url, verify_method: method })
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error||'Submission failed');
    await loadAll(); render();
    if(method === 'auto') showToast('Auto verify requested. Validating SMS...');
    else showToast('Payment submitted for manual review');
  } catch(err){ 
    showToast(err.message,'error'); 
    if(method === 'auto') document.getElementById('autoVerifyBtn').innerHTML = btnText;
    else document.getElementById('manualVerifyBtn').innerHTML = btnText;
  }
}

function doLogout(){
  isAdmin = false; adminToken = null; localStorage.removeItem('qe_admin_token');
}

document.getElementById('adminBtn').addEventListener('click', ()=>{
  if(isAdmin){ doLogout(); render(); showToast('Logged out successfully'); return; }
  showModal(`
    <div class="text-center mb-6"><div class="w-16 h-16 bg-qeRed/10 text-qeRed rounded-full flex items-center justify-center mx-auto mb-4 scale-in"><i data-lucide="shield-check" class="w-8 h-8"></i></div><h3 class="font-bold disp text-2xl text-slate-900 dark:text-white">Admin Login</h3><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your password to manage the system</p></div>
    <input type="password" id="adminPassInput" class="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-center tracking-widest font-mono outline-none text-slate-900 dark:text-white focus:border-qeRed/50 transition-colors" placeholder="••••••••">
    <div class="flex gap-3 mt-6"><button id="al-cancel" class="flex-1 py-3.5 text-sm bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Cancel</button><button id="al-ok" class="flex-1 py-3.5 text-sm bg-qeRed text-white rounded-xl font-bold shadow-lg shadow-qeRed/20 hover:bg-qeRedDim transition-colors">Login</button></div>
  `);
  document.getElementById('al-cancel').addEventListener('click', hideModal);
  document.getElementById('al-ok').addEventListener('click', async ()=>{
    const password = document.getElementById('adminPassInput').value;
    try{
      const res = await fetch('/api/admin-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
      const json = await res.json();
      if(!res.ok) throw new Error(json.error||'Invalid Password');
      adminToken = json.token; isAdmin = true; localStorage.setItem('qe_admin_token', adminToken);
      hideModal(); render(); showToast('Login successful!');
    } catch(err){ showToast(err.message,'error'); }
  });
});

document.getElementById('themeToggleBtn').addEventListener('click', () => {
  const html = document.documentElement;
  if(html.classList.contains('dark')) {
    html.classList.remove('dark');
    localStorage.setItem('qe_theme', 'light');
  } else {
    html.classList.add('dark');
    localStorage.setItem('qe_theme', 'dark');
  }
});

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', e=>{
    activeTab = e.currentTarget.dataset.tab;
    localStorage.setItem('qe_tab', activeTab);
    const app = document.getElementById('app');
    app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in');
    render();
  });
});

async function init(){
  try{
    const cfg = await (await fetch('/api/config')).json();
    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  } catch(e){ showToast('Failed to load config','error'); }
  await loadAll();
  render();
}
init();
</script>
