<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QE Scrim | Team Management</title>
<meta name="theme-color" content="#0a0a0f">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/logo-transparent.png">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { display: ['"Rajdhani"','sans-serif'], body: ['"Hind Siliguri"','"Inter"','sans-serif'] },
    colors: { qeBg:'#0a0a0f', qeCard:'#131319', qeBorder:'#232330', qeRed:'#c8203d', qeRedDim:'#7a1428' }
  }}
}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html,body{ background:#0a0a0f; }
  body { font-family:'Hind Siliguri','Inter',sans-serif; }
  .disp { font-family:'Rajdhani',sans-serif; letter-spacing:.02em; }
  .hide-scrollbar::-webkit-scrollbar{ display:none; } .hide-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .cut-card{ clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  .cut-card-sm{ clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .glass{ background:rgba(19,19,25,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .mesh-lines{ background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.09) 0 2px, transparent 2px 26px); }
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .fade-in{ animation:fadeIn .45s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
  .scale-in{ animation:scaleIn .25s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes scaleIn{ from{opacity:0; transform:scale(.92)} to{opacity:1; transform:scale(1)} }
  .toast-in{ animation:toastIn .3s ease-out forwards; }
  @keyframes toastIn{ from{opacity:0; transform:translateX(110%)} to{opacity:1; transform:translateX(0)} }
  .glow-red{ box-shadow:0 0 0 1px rgba(200,32,61,.35), 0 8px 30px -8px rgba(200,32,61,.5); }
  ::selection{ background:#c8203d; color:#fff; }
  .rank-1{ background:linear-gradient(135deg,#7a5c00,#d4af37); }
  .rank-2{ background:linear-gradient(135deg,#5c5c5c,#c0c0c0); }
  .rank-3{ background:linear-gradient(135deg,#5c2e0e,#cd7f32); }
</style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col overflow-hidden h-screen">

<header class="glass z-40 shrink-0 border-b border-qeBorder px-4 py-3 relative mesh-lines">
  <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <img src="/assets/logo-transparent.png" class="w-10 h-10 object-contain shrink-0" alt="QE">
      <div class="min-w-0">
        <h1 class="disp text-xl font-bold text-white leading-none tracking-wide">QE <span class="text-qeRed">SCRIM</span></h1>
        <p class="text-[10px] text-slate-500 font-semibold tracking-widest uppercase">Team Management</p>
      </div>
    </div>
    <button id="adminBtn" class="flex items-center gap-1.5 text-xs font-bold text-qeRed bg-qeRed/10 px-3 py-2 rounded-lg border border-qeRed/30 active:scale-95 transition-transform shrink-0">
      <i data-lucide="shield" class="w-4 h-4"></i> <span id="adminBtnText">এডমিন</span>
    </button>
  </div>
</header>

<div class="w-full glass border-b border-qeBorder py-1.5 shrink-0">
  <p class="text-center text-[11px] text-slate-500">
    Developed by <a href="https://linkedin.com/in/RahatAhmedX" target="_blank" class="text-qeRed font-semibold hover:underline">Rahat</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/Rahat0764" target="_blank" class="text-slate-400 font-semibold hover:text-white inline-flex items-center gap-1">
      <i data-lucide="github" class="w-3 h-3"></i> GitHub
    </a>
  </p>
</div>

<div id="main-scroll" class="flex-1 overflow-y-auto w-full pb-28 pt-4 px-4 md:px-6 hide-scrollbar">
  <main id="app" class="max-w-6xl mx-auto fade-in"></main>
</div>

<nav class="glass z-40 fixed bottom-0 left-0 w-full border-t border-qeBorder pb-safe">
  <div class="max-w-6xl mx-auto flex justify-around items-center h-16 px-1">
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">ড্যাশবোর্ড</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="teams"><i data-lucide="swords" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">টিম</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="standings"><i data-lucide="trophy" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">স্ট্যান্ডিংস</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="payments"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">পেমেন্ট</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="activity"><i data-lucide="activity" class="w-5 h-5"></i><span class="text-[10px] disp font-bold">লগ</span></button>
  </div>
</nav>

<div id="modalContainer" class="fixed inset-0 bg-black/85 z-50 hidden flex justify-center items-center px-4 backdrop-blur-sm overflow-y-auto py-8"></div>
<div id="toast-container" class="fixed top-20 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

let supabase = null;
let activeTab = localStorage.getItem('qe_tab') || 'dashboard';
let adminToken = localStorage.getItem('qe_admin_token') || null;
let isAdmin = !!adminToken;

let data = { teams: [], matches: [], results: [], settings: null, payments: [], logs: [], numbers: [] };
let selectedMatchId = null;

const showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = type==='success' ? 'bg-emerald-600' : (type==='error' ? 'bg-qeRed' : 'bg-slate-700');
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-white ${colors} text-sm font-semibold max-w-xs`;
  t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3200);
};

const copyText = async (text, label) => {
  try {
    await navigator.clipboard.writeText(text);
    showToast(`${label} কপি হয়েছে!`);
  } catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); showToast(`${label} কপি হয়েছে!`);
  }
};

const showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="glass w-full max-w-md rounded-2xl p-6 border border-qeBorder fade-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar">${html}</div>`;
  mc.classList.remove('hidden');
  lucide.createIcons();
  mc.onclick = (e) => { if(e.target === mc) hideModal(); };
};
const hideModal = () => document.getElementById('modalContainer').classList.add('hidden');
window.hideModal = hideModal;

async function api(action, payload) {
  const res = await fetch('/api/admin-write', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken || '' },
    body: JSON.stringify({ action, payload })
  });
  const json = await res.json();
  if(!res.ok){
    if(res.status === 401){ doLogout(); showToast('সেশন শেষ, আবার লগইন করুন', 'error'); }
    throw new Error(json.error || 'এরর হয়েছে');
  }
  return json;
}

async function loadAll() {
  try {
    const [t, m, r, s, p, l, n] = await Promise.all([
      supabase.from('teams').select('*').order('created_at'),
      supabase.from('matches').select('*').order('match_no'),
      supabase.from('match_results').select('*'),
      supabase.from('point_settings').select('*').eq('id',1).single(),
      supabase.from('payments').select('*').order('created_at', { ascending: false }),
      supabase.from('activity_logs').select('*').order('created_at', { ascending: false }).limit(60),
      supabase.from('bkash_numbers').select('*').eq('id',1).single()
    ]);
    data.teams = t.data || []; data.matches = m.data || []; data.results = r.data || [];
    data.settings = s.data || { kill_point_value:1, position_table:{} };
    data.payments = p.data || []; data.logs = l.data || [];
    data.numbers = (n.data && n.data.numbers) || [];
    if(!selectedMatchId && data.matches.length) selectedMatchId = data.matches[data.matches.length-1].id;
  } catch(e) { showToast('ডাটা লোড করতে সমস্যা হয়েছে', 'error'); }
}

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if(b.dataset.tab === activeTab){ b.classList.add('text-qeRed'); b.classList.remove('text-slate-500'); }
    else { b.classList.remove('text-qeRed'); b.classList.add('text-slate-500'); }
  });
}

function render(){
  const app = document.getElementById('app');
  if(activeTab==='dashboard') app.innerHTML = buildDashboard();
  else if(activeTab==='teams') app.innerHTML = buildTeams();
  else if(activeTab==='standings') app.innerHTML = buildStandings();
  else if(activeTab==='payments') app.innerHTML = buildPayments();
  else if(activeTab==='activity') app.innerHTML = buildActivity();
  lucide.createIcons();
  attachListeners();
  updateNav();
  document.getElementById('adminBtnText').innerText = isAdmin ? 'লগআউট' : 'এডমিন';
}

function statCard(label, value, icon, grad){
  return `<div class="cut-card ${grad} p-5 relative overflow-hidden shadow-xl">
    <i data-lucide="${icon}" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/10"></i>
    <span class="text-[10px] font-bold uppercase tracking-widest text-white/70 block mb-1">${label}</span>
    <h3 class="text-3xl font-bold disp text-white relative z-10">${value}</h3>
  </div>`;
}

function buildDashboard(){
  const totalTeams = data.teams.length;
  const totalFund = data.payments.filter(p=>p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0);
  const pendingCount = data.payments.filter(p=>p.status==='pending').length;
  const totalMatches = data.matches.length;

  let html = `<div class="mb-6 cut-card mesh-lines bg-gradient-to-br from-qeRedDim via-qeCard to-qeCard border border-qeBorder p-6 relative overflow-hidden">
    <img src="/assets/logo-transparent.png" class="absolute -right-4 -top-6 w-40 opacity-20">
    <p class="text-qeRed font-bold text-xs uppercase tracking-widest mb-1">Welcome</p>
    <h2 class="disp text-3xl font-bold text-white mb-2">QE SCRIM কন্ট্রোল রুম</h2>
    <p class="text-sm text-slate-400 max-w-md">টিম, স্ট্যান্ডিংস এবং পেমেন্ট — সব একজায়গায় ম্যানেজ করুন। ${isAdmin ? 'আপনি এডমিন মোডে আছেন।' : 'বিস্তারিত দেখতে নিচের ট্যাব থেকে যেকোনো সেকশনে যান।'}</p>
  </div>`;

  html += `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    ${statCard('মোট টিম', totalTeams, 'swords', 'bg-gradient-to-br from-indigo-600 to-indigo-800')}
    ${statCard('মোট ম্যাচ', totalMatches, 'gamepad-2', 'bg-gradient-to-br from-qeRed to-qeRedDim')}
    ${statCard('মোট ফান্ড', '৳'+totalFund, 'wallet', 'bg-gradient-to-br from-emerald-600 to-emerald-800')}
    ${statCard('পেন্ডিং পেমেন্ট', pendingCount, 'clock', 'bg-gradient-to-br from-amber-600 to-amber-800')}
  </div>`;

  html += `<div class="cut-card bg-qeCard border border-qeBorder overflow-hidden">
    <div class="p-4 border-b border-qeBorder flex items-center gap-2"><i data-lucide="activity" class="w-4 h-4 text-qeRed"></i><h3 class="font-bold disp tracking-wide">সাম্প্রতিক অ্যাক্টিভিটি</h3></div>
    <div class="divide-y divide-qeBorder max-h-80 overflow-y-auto hide-scrollbar">
      ${data.logs.slice(0,8).map(l=>`
        <div class="p-4 flex gap-3">
          <div class="w-8 h-8 rounded-lg bg-qeRed/10 text-qeRed flex items-center justify-center shrink-0"><i data-lucide="bell" class="w-4 h-4"></i></div>
          <div class="min-w-0"><p class="text-sm font-semibold">${l.action}</p><p class="text-xs text-slate-400 mt-0.5">${l.details}</p><p class="text-[10px] text-slate-600 mt-1">${new Date(l.created_at).toLocaleString('bn-BD')}</p></div>
        </div>`).join('') || '<div class="p-8 text-center text-slate-500 text-sm">কোনো অ্যাক্টিভিটি নেই</div>'}
    </div>
  </div>`;
  return html;
}

function buildTeams(){
  let html = `<div class="flex justify-between items-center mb-5">
    <h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="swords" class="w-6 h-6 text-qeRed"></i> টিম রোস্টার</h2>
    ${isAdmin ? `<button id="addTeamBtn" class="bg-qeRed text-white px-3 py-2 rounded-lg text-xs font-bold cut-card-sm active:scale-95"><i data-lucide="plus" class="inline w-3 h-3"></i> নতুন টিম</button>` : ''}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

  if(!data.teams.length) html += `<div class="col-span-full p-10 text-center text-slate-500 cut-card bg-qeCard border border-qeBorder">কোনো টিম যোগ করা হয়নি।</div>`;

  html += data.teams.map(t=>{
    const main = t.main_players || []; const res = t.reserve_players || [];
    return `<div class="cut-card bg-qeCard border border-qeBorder p-5 relative">
      ${isAdmin ? `<div class="absolute top-4 right-4 flex gap-2">
        <button class="edit-team-btn p-2 bg-slate-800 rounded-lg text-slate-400 hover:text-qeRed" data-id="${t.id}"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
        <button class="del-team-btn p-2 bg-slate-800 rounded-lg text-slate-400 hover:text-qeRed" data-id="${t.id}"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>` : ''}
      <div class="flex items-center gap-3 mb-3">
        <div class="w-11 h-11 rounded-lg bg-gradient-to-br from-qeRed to-qeRedDim flex items-center justify-center font-bold disp text-lg">${(t.slot_no||'?')}</div>
        <div><h3 class="font-bold text-lg disp">${t.team_name}</h3><p class="text-[10px] text-slate-500 uppercase tracking-wider">স্লট ${t.slot_no ?? '-'}</p></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
        <div>
          <p class="text-[10px] font-bold text-emerald-500 uppercase mb-1">মূল ৪ জন</p>
          ${main.map(p=>`<p class="text-slate-300 text-xs py-0.5">${p||'-'}</p>`).join('') || '<p class="text-slate-600 text-xs">-</p>'}
        </div>
        <div>
          <p class="text-[10px] font-bold text-amber-500 uppercase mb-1">৫ম/রিজার্ভ</p>
          ${res.map(p=>`<p class="text-slate-300 text-xs py-0.5">${p||'-'}</p>`).join('') || '<p class="text-slate-600 text-xs">-</p>'}
        </div>
      </div>
      <div class="pt-3 border-t border-qeBorder flex items-center justify-between">
        <div class="min-w-0"><p class="text-xs font-bold text-slate-300">${t.manager_name || 'ম্যানেজার নেই'}</p><p class="text-[10px] text-slate-500">IGN: ${t.manager_ign || '-'}</p></div>
        ${t.manager_contact ? `<button class="copy-btn flex items-center gap-1 text-[11px] bg-slate-800 px-2 py-1.5 rounded-lg text-slate-300" data-copy="${t.manager_contact}" data-label="নাম্বার"><i data-lucide="copy" class="w-3 h-3"></i>${t.manager_contact}</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return html + `</div>`;
}

function buildStandings(){
  const matchOptions = data.matches.map(m=>`<option value="${m.id}" ${m.id===selectedMatchId?'selected':''}>${m.match_label || ('ম্যাচ '+m.match_no)}</option>`).join('');

  const totals = {};
  data.teams.forEach(t=> totals[t.id] = { team:t, pos:0, kill:0, total:0 });
  data.results.forEach(r=>{ if(totals[r.team_id]){ totals[r.team_id].pos += r.position_points||0; totals[r.team_id].kill += r.kill_points||0; totals[r.team_id].total += r.total_points||0; } });
  const overall = Object.values(totals).sort((a,b)=>b.total-a.total);

  let html = `<div class="flex justify-between items-center mb-5 flex-wrap gap-2">
    <h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="trophy" class="w-6 h-6 text-qeRed"></i> স্ট্যান্ডিংস</h2>
    ${isAdmin ? `<div class="flex gap-2">
      <button id="addMatchBtn" class="bg-slate-800 text-slate-200 px-3 py-2 rounded-lg text-xs font-bold cut-card-sm active:scale-95"><i data-lucide="plus" class="inline w-3 h-3"></i> ম্যাচ যোগ</button>
      <button id="pointSettingsBtn" class="bg-slate-800 text-slate-200 px-3 py-2 rounded-lg text-xs font-bold cut-card-sm active:scale-95"><i data-lucide="settings" class="inline w-3 h-3"></i> পয়েন্ট সেটিং</button>
    </div>` : ''}
  </div>`;

  html += `<div class="cut-card bg-qeCard border border-qeBorder mb-6 overflow-hidden">
    <div class="p-4 border-b border-qeBorder flex justify-between items-center gap-2 flex-wrap">
      <h3 class="font-bold disp">ওভারঅল টেবিল</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm whitespace-nowrap">
        <thead><tr class="text-slate-500 text-xs border-b border-qeBorder"><th class="p-3">র‍্যাংক</th><th class="p-3">টিম</th><th class="p-3">পজিশন পয়েন্ট</th><th class="p-3">কিল পয়েন্ট</th><th class="p-3">মোট</th></tr></thead>
        <tbody>
          ${overall.map((o,idx)=>`
            <tr class="border-b border-qeBorder/60">
              <td class="p-3"><span class="w-7 h-7 inline-flex items-center justify-center rounded-lg font-bold disp text-xs ${idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'bg-slate-800 text-slate-400'}">${idx+1}</span></td>
              <td class="p-3 font-semibold">${o.team.team_name}</td>
              <td class="p-3 text-slate-400">${o.pos}</td>
              <td class="p-3 text-slate-400">${o.kill}</td>
              <td class="p-3 font-bold text-qeRed">${o.total}</td>
            </tr>`).join('') || `<tr><td colspan="5" class="p-8 text-center text-slate-500">কোনো টিম নেই</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;

  if(data.matches.length){
    html += `<div class="cut-card bg-qeCard border border-qeBorder overflow-hidden">
      <div class="p-4 border-b border-qeBorder flex justify-between items-center gap-2 flex-wrap">
        <h3 class="font-bold disp">ম্যাচ-ভিত্তিক এন্ট্রি</h3>
        <select id="matchSelect" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1.5 outline-none">${matchOptions}</select>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
          <thead><tr class="text-slate-500 text-xs border-b border-qeBorder"><th class="p-3">টিম</th><th class="p-3">পজিশন</th><th class="p-3">কিল</th><th class="p-3">টোটাল</th>${isAdmin?'<th class="p-3">সেভ</th>':''}</tr></thead>
          <tbody>
            ${data.teams.map(t=>{
              const r = data.results.find(x=>x.team_id===t.id && x.match_id===selectedMatchId) || {};
              return `<tr class="border-b border-qeBorder/60" data-team="${t.id}">
                <td class="p-3 font-semibold">${t.team_name}</td>

function attachListeners(){
  document.querySelectorAll('.copy-btn').forEach(b=> b.addEventListener('click', e=> copyText(e.currentTarget.dataset.copy, e.currentTarget.dataset.label)));

  if(activeTab==='teams'){
    document.getElementById('addTeamBtn')?.addEventListener('click', ()=> openTeamModal(null));
    document.querySelectorAll('.edit-team-btn').forEach(b=> b.addEventListener('click', e=> openTeamModal(data.teams.find(t=>t.id===e.currentTarget.dataset.id))));
    document.querySelectorAll('.del-team-btn').forEach(b=> b.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      confirmModal('টিম মুছে ফেলুন', 'আপনি কি নিশ্চিত? এই টিমের সব রেজাল্টও মুছে যাবে।', async ()=>{
        try{ await api('delete_team',{id}); await loadAll(); hideModal(); render(); showToast('টিম মুছে ফেলা হয়েছে'); }
        catch(err){ showToast(err.message,'error'); }
      });
    }));
  }

  if(activeTab==='standings'){
    document.getElementById('matchSelect')?.addEventListener('change', e=>{ selectedMatchId = e.target.value; render(); });
    document.getElementById('addMatchBtn')?.addEventListener('click', openMatchModal);
    document.getElementById('pointSettingsBtn')?.addEventListener('click', openPointSettingsModal);
    document.querySelectorAll('.save-result-btn').forEach(b=> b.addEventListener('click', async e=>{
      const teamId = e.currentTarget.dataset.team;
      const row = e.currentTarget.closest('tr');
      const position = row.querySelector('.res-pos').value;
      const kills = row.querySelector('.res-kill').value;
      try{ await api('upsert_result', { match_id: selectedMatchId, team_id: teamId, position: Number(position), kills: Number(kills) }); await loadAll(); render(); showToast('রেজাল্ট সেভ হয়েছে'); }
      catch(err){ showToast(err.message,'error'); }
    }));
  }

  if(activeTab==='payments'){
    document.getElementById('submitPayBtn')?.addEventListener('click', submitPayment);
    document.getElementById('editNumbersBtn')?.addEventListener('click', openNumbersModal);
    document.querySelectorAll('.approve-pay-btn').forEach(b=> b.addEventListener('click', async e=>{
      try{ await api('approve_payment',{id:e.currentTarget.dataset.id}); await loadAll(); render(); showToast('অ্যাপ্রুভ হয়েছে'); }
      catch(err){ showToast(err.message,'error'); }
    }));
    document.querySelectorAll('.reject-pay-btn').forEach(b=> b.addEventListener('click', async e=>{
      try{ await api('reject_payment',{id:e.currentTarget.dataset.id}); await loadAll(); render(); showToast('রিজেক্ট করা হয়েছে'); }
      catch(err){ showToast(err.message,'error'); }
    }));
  }

  if(activeTab==='activity'){
    document.querySelectorAll('.del-log-btn').forEach(b=> b.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      confirmModal('লগ মুছুন', 'এই লগ এন্ট্রি স্থায়ীভাবে মুছে যাবে।', async ()=>{
        try{ await api('delete_log',{id}); await loadAll(); hideModal(); render(); showToast('মুছে ফেলা হয়েছে'); }
        catch(err){ showToast(err.message,'error'); }
      });
    }));
  }
}

function confirmModal(title, msg, onConfirm){

    <p class="text-xs text-slate-400 mb-6 text-center">${msg}</p>

  `);

  document.getElementById('cm-ok').addEventListener('click', onConfirm);
}

      ${[0,1,2,3].map(i=>`<input class="tm-res w-full p-3 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none" placeholder="রিজার্ভ ${i+1}" value="${res[i]||''}">`).join('')}

  document.getElementById('tm-save').addEventListener('click', async ()=>{
    const payload = {
      team_name: document.getElementById('tm-name').value,

async function submitPayment(){
  const payer_name = document.getElementById('payName').value;
  const amount = document.getElementById('payAmount').value;
  const team_id = document.getElementById('payTeam').value || null;
  const sender_number = document.getElementById('paySender').value;
  const trx_id = document.getElementById('payTrx').value;
  const file = document.getElementById('payScreenshot').files[0];

  if(!payer_name || !amount) return showToast('নাম এবং পরিমাণ দিন','error');

  let screenshot_url = null;
  try {
    if(file){
      const path = `${Date.now()}-${file.name}`.replace(/\s+/g,'_');
      const { error: upErr } = await supabase.storage.from('payment-proofs').upload(path, file);
      if(!upErr){ const { data: pub } = supabase.storage.from('payment-proofs').getPublicUrl(path); screenshot_url = pub.publicUrl; }
    }
    const res = await fetch('/api/payment-submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ team_id, payer_name, amount, trx_id, sender_number, screenshot_url })
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error||'এরর হয়েছে');
    await loadAll(); render();
    showToast('পেমেন্ট সাবমিট হয়েছে, এডমিন রিভিউ করবেন');
  } catch(err){ showToast(err.message,'error'); }
}

function doLogout(){
  isAdmin = false; adminToken = null; localStorage.removeItem('qe_admin_token');
}

document.getElementById('adminBtn').addEventListener('click', ()=>{
  if(isAdmin){ doLogout(); render(); showToast('লগআউট হয়েছে'); return; }
  showModal(`
    <div class="text-center mb-5"><div class="w-14 h-14 bg-qeRed/10 text-qeRed rounded-full flex items-center justify-center mx-auto mb-3 scale-in"><i data-lucide="shield-check" class="w-7 h-7"></i></div><h3 class="font-bold disp text-xl">এডমিন লগইন</h3></div>
    <input type="password" id="adminPassInput" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-sm text-center tracking-widest font-mono outline-none" placeholder="পাসওয়ার্ড দিন">
    <div class="flex gap-3 mt-6"><button id="al-cancel" class="flex-1 py-3 text-sm bg-slate-800 rounded-lg font-bold">বাতিল</button><button id="al-ok" class="flex-1 py-3 text-sm bg-qeRed text-white rounded-lg font-bold">লগইন</button></div>
  `);
  document.getElementById('al-cancel').addEventListener('click', hideModal);
  document.getElementById('al-ok').addEventListener('click', async ()=>{
    const password = document.getElementById('adminPassInput').value;
    try{
      const res = await fetch('/api/admin-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
      const json = await res.json();
      if(!res.ok) throw new Error(json.error||'ভুল পাসওয়ার্ড');
      adminToken = json.token; isAdmin = true; localStorage.setItem('qe_admin_token', adminToken);
      hideModal(); render(); showToast('লগইন সফল হয়েছে!');
    } catch(err){ showToast(err.message,'error'); }
  });
});

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', e=>{
    activeTab = e.currentTarget.dataset.tab;
    localStorage.setItem('qe_tab', activeTab);
    const app = document.getElementById('app');
    app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in');
    render();
  });
});

async function init(){
  try{
    const cfg = await (await fetch('/api/config')).json();
    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  } catch(e){ showToast('কনফিগারেশন লোড ব্যর্থ হয়েছে','error'); }
  await loadAll();
  render();
}
init();
</script>
