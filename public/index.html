<div id="modalContainer" class="fixed inset-0 bg-slate-900/40 dark:bg-black/80 z-50 hidden flex justify-center items-center px-4 backdrop-blur-md overflow-y-auto py-8 transition-all"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

let supabase = null;
let activeTab = localStorage.getItem('qe_tab') || 'dashboard';
let adminToken = localStorage.getItem('qe_admin_token') || null;
let isAdmin = !!adminToken;

let data = { teams: [], matches: [], results: [], settings: null, payments: [], logs: [], numbers: [], appSettings: null, tournaments: [], players: [], player_stats: [] };
let timers = [];

const showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = type==='success' ? 'bg-emerald-600' : (type==='error' ? 'bg-qeRed' : 'bg-slate-800');
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl text-white ${colors} text-sm font-semibold max-w-xs border border-white/20 backdrop-blur-lg`;
  t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3200);
};

const showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="bg-white/95 dark:bg-[#131319]/95 backdrop-blur-2xl w-full max-w-lg rounded-3xl p-6 border border-slate-200 dark:border-white/10 fade-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar text-slate-900 dark:text-white transition-colors">${html}</div>`;
  mc.classList.remove('hidden');
  lucide.createIcons();
  mc.onclick = (e) => { if(e.target === mc) hideModal(); };
};
const hideModal = () => document.getElementById('modalContainer').classList.add('hidden');
window.hideModal = hideModal;

async function api(action, payload, isPublic = false) {
  const endpoint = isPublic ? '/api/public-submit' : '/api/admin-write';
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken || '' },
    body: JSON.stringify({ action, payload })
  });
  const json = await res.json();
  if(!res.ok){
    if(res.status === 401){ doLogout(); showToast('Session expired', 'error'); }
    throw new Error(json.error || 'Server error');
  }
  return json;
}

async function uploadFileToSupabase(bucket, fileInputId) {
  const fileInput = document.getElementById(fileInputId);
  if(!fileInput || !fileInput.files || !fileInput.files[0]) return null;
  const file = fileInput.files[0];
  const ext = file.name.split('.').pop();
  const path = `${Date.now()}_${Math.random().toString(36).substring(2,9)}.${ext}`;
  
  const { data, error } = await supabase.storage.from(bucket).upload(path, file);
  if (error) throw error;
  
  const { data: pubData } = supabase.storage.from(bucket).getPublicUrl(path);
  return pubData.publicUrl;
}

async function loadAll() {
  try {
    const [t, m, r, s, p, l, n, as, tr, pl, ps] = await Promise.all([
      supabase.from('teams').select('*').order('created_at'),
      supabase.from('matches').select('*').order('match_no'),
      supabase.from('match_results').select('*'),
      supabase.from('point_settings').select('*').eq('id',1).single(),
      supabase.from('payments').select('*').order('created_at', { ascending: false }),
      supabase.from('activity_logs').select('*').order('created_at', { ascending: false }).limit(40),
      supabase.from('bkash_numbers').select('*').eq('id',1).single(),
      supabase.from('app_settings').select('*').eq('id',1).single(),
      supabase.from('tournaments').select('*').order('created_at', {ascending: false}),
      supabase.from('players').select('*'),
      supabase.from('player_stats').select('*')
    ]);
    data = { 
      teams: t.data||[], matches: m.data||[], results: r.data||[], 
      settings: s.data||{kill_point_value:1, position_table:{}}, payments: p.data||[], 
      logs: l.data||[], numbers: n.data?.numbers||[], appSettings: as.data||null,
      tournaments: tr.data||[], players: pl.data||[], player_stats: ps.data||[]
    };
  } catch(e) { console.error(e); }
}

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if(b.dataset.tab === activeTab){ b.classList.add('text-qeRed'); b.classList.remove('text-slate-500', 'dark:text-slate-500'); }
    else { b.classList.remove('text-qeRed'); b.classList.add('text-slate-500', 'dark:text-slate-500'); }
  });
}

function clearTimers(){ timers.forEach(clearInterval); timers = []; }

function render(){
  clearTimers();
  const app = document.getElementById('app');
  if(activeTab==='dashboard') app.innerHTML = buildDashboard();
  else if(activeTab==='tournaments') app.innerHTML = buildTournaments();
  else if(activeTab==='teams') app.innerHTML = buildTeams();
  else if(activeTab==='standings') app.innerHTML = buildStandings();
  else if(activeTab==='payments') app.innerHTML = buildPayments();
  else if(activeTab==='activity') app.innerHTML = buildActivity();
  lucide.createIcons();
  attachListeners();
  updateNav();
  document.getElementById('adminBtnText').innerText = isAdmin ? 'Logout' : 'Admin';
}

function statCard(label, value, icon, grad){
  return `<div class="cut-card ${grad} p-5 relative overflow-hidden shadow-lg border border-white/20 dark:border-white/5 transition-transform hover:-translate-y-1">
    <i data-lucide="${icon}" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/10 dark:text-white/5"></i>
    <span class="text-[10px] font-bold uppercase tracking-widest text-white/90 dark:text-white/70 block mb-1">${label}</span>
    <h3 class="text-3xl font-bold disp text-white relative z-10">${value}</h3>
  </div>`;
}

function buildDashboard(){
  const totalTeams = data.teams?.length || 0;
  const totalMatches = data.matches?.length || 0;
  const totalFund = (data.payments||[]).filter(p=>p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0);
  const pendingCount = (data.payments||[]).filter(p=>p.status==='pending').length;
  
  const appTitle = data.appSettings?.title || 'QE SCRIM Dashboard';
  const appDesc = data.appSettings?.description || 'Manage teams, standings, and automated payments all in one place.';

  let html = `
  <div class="mb-6 cut-card mesh-lines bg-gradient-to-br from-qeRedDim/10 to-white dark:to-qeCard border border-slate-200 dark:border-white/5 p-6 md:p-8 relative overflow-hidden shadow-sm transition-colors">
    <img src="/assets/logo-transparent.png" class="absolute -right-4 -top-6 w-40 opacity-10 dark:opacity-20 pointer-events-none mix-blend-overlay">
    <div class="flex justify-between items-start relative z-10">
      <div>
        <p class="text-qeRed font-bold text-[10px] uppercase tracking-[0.2em] mb-1 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-qeRed animate-pulse"></span> Welcome</p>
        <h2 class="disp text-3xl md:text-4xl font-bold text-slate-900 dark:text-white mb-2 transition-colors">${appTitle}</h2>
        <p class="text-sm text-slate-600 dark:text-slate-400 max-w-md transition-colors leading-relaxed">${appDesc}</p>
        ${isAdmin ? `<p class="mt-3 text-[11px] text-emerald-600 dark:text-emerald-400 font-bold flex items-center gap-1 bg-emerald-50 dark:bg-emerald-500/10 px-2.5 py-1 w-max rounded-lg border border-emerald-200 dark:border-emerald-500/20"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Admin Mode Active</p>` : ''}
      </div>
      ${isAdmin ? `<button id="editSettingsBtn" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 p-2 rounded-xl border border-slate-200 dark:border-slate-700 active:scale-95 shadow-sm hover:text-qeRed transition-colors"><i data-lucide="edit-3" class="w-4 h-4"></i></button>` : ''}
    </div>
  </div>
  
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
    ${statCard('Total Teams', totalTeams, 'swords', 'bg-gradient-to-br from-indigo-500 to-indigo-600')}
    ${statCard('Total Matches', totalMatches, 'gamepad-2', 'bg-gradient-to-br from-qeRed to-qeRedDim')}
    ${statCard('Total Fund', '৳'+totalFund, 'wallet', 'bg-gradient-to-br from-emerald-500 to-emerald-600')}
    ${statCard('Pending Pay', pendingCount, 'clock', 'bg-gradient-to-br from-amber-500 to-amber-600')}
  </div>
  
  <div class="cut-card bg-white dark:bg-qeCard border border-slate-200 dark:border-white/5 overflow-hidden shadow-sm transition-colors">
    <div class="p-4 border-b border-slate-200 dark:border-white/5 flex items-center gap-2 transition-colors bg-slate-50 dark:bg-transparent"><i data-lucide="activity" class="w-4 h-4 text-qeRed"></i><h3 class="font-bold disp tracking-wide text-lg text-slate-900 dark:text-white">Recent Activity</h3></div>
    <div class="divide-y divide-slate-100 dark:divide-white/5 max-h-80 overflow-y-auto hide-scrollbar transition-colors">
      ${(data.logs||[]).slice(0,8).map(l=>`
        <div class="p-4 flex gap-3 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
          <div class="w-8 h-8 rounded-xl bg-qeRed/10 border border-qeRed/20 text-qeRed flex items-center justify-center shrink-0 shadow-sm"><i data-lucide="bell" class="w-4 h-4"></i></div>
          <div class="min-w-0"><p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${l.action}</p><p class="text-xs text-slate-600 dark:text-slate-400 mt-0.5 leading-relaxed">${l.details}</p><p class="text-[10px] text-slate-400 dark:text-slate-500 mt-1.5 font-medium">${new Date(l.created_at).toLocaleString('en-US')}</p></div>
        </div>`).join('') || '<div class="p-10 text-center text-slate-500 text-sm font-medium">No recent activity</div>'}
    </div>
  </div>`;
  return html;
}

function startCountdown(elementId, deadlineStr) {
  const el = document.getElementById(elementId);
  if(!el) return;
  const target = new Date(deadlineStr).getTime();
  const timer = setInterval(()=>{
    const now = new Date().getTime();
    const diff = target - now;
    if(diff <= 0) { clearInterval(timer); el.innerHTML = "Registration Closed"; return; }
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    el.innerHTML = `Ends in: <span class="text-qeRed font-bold">${d}d ${h}h ${m}m</span>`;
  }, 1000);
  timers.push(timer);
}

function buildTournaments(){
  let html = `<div class="flex justify-between items-center mb-6">
    <h2 class="disp text-2xl font-bold flex items-center gap-2 text-slate-900 dark:text-white"><i data-lucide="crosshair" class="w-6 h-6 text-qeRed"></i> Tournaments</h2>
    ${isAdmin ? `<button id="addTourBtn" class="bg-qeRed text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-qeRed/30 active:scale-95 transition-transform"><i data-lucide="plus" class="inline w-3 h-3"></i> Add Event</button>` : ''}
  </div><div class="space-y-5">`;

  if(!data.tournaments.length) html += `<div class="glass p-10 text-center text-slate-500 rounded-3xl border border-slate-200 dark:border-white/5 font-medium">No active tournaments available.</div>`;

  data.tournaments.forEach(t => {
    const isClosed = new Date(t.deadline).getTime() < new Date().getTime();
    html += `<div class="glass border border-slate-200 dark:border-white/5 rounded-3xl p-6 relative overflow-hidden group hover:shadow-xl transition-all bg-white dark:bg-transparent">
      <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-qeRed/10 dark:from-qeRed/20 to-transparent blur-2xl rounded-full -mr-10 -mt-10 pointer-events-none"></div>
      ${isAdmin ? `<button class="absolute top-4 right-4 p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500 hover:text-qeRed transition-colors z-10 border border-slate-200 dark:border-slate-700" onclick="editTour('${t.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i></button>` : ''}
      
      <div class="flex items-center gap-3 mb-4 relative z-10">
        <div class="w-10 h-10 rounded-full bg-qeRed/10 border border-qeRed/20 flex items-center justify-center text-qeRed shadow-sm"><i data-lucide="award" class="w-5 h-5"></i></div>
        <div>
          <h3 class="disp text-xl font-bold text-slate-900 dark:text-white leading-tight">${t.title}</h3>
          <p class="text-xs text-slate-500 font-medium mt-0.5" id="timer-${t.id}">${isClosed ? 'Registration Closed' : 'Loading...'}</p>
        </div>
      </div>
      <p class="text-sm text-slate-700 dark:text-slate-300 mb-5 whitespace-pre-line relative z-10 leading-relaxed font-medium">${t.description || ''}</p>
      
      <div class="grid grid-cols-2 gap-3 mb-5 relative z-10">
        <div class="bg-slate-50 dark:bg-black/20 p-3 rounded-2xl border border-slate-200 dark:border-white/5">
          <p class="text-[10px] uppercase text-slate-500 dark:text-slate-400 font-bold mb-1 tracking-wide">Entry Fee</p>
          <p class="font-bold text-lg text-emerald-600 dark:text-emerald-400 disp">৳${t.entry_fee}</p>
        </div>
        <div class="bg-slate-50 dark:bg-black/20 p-3 rounded-2xl border border-slate-200 dark:border-white/5">
          <p class="text-[10px] uppercase text-slate-500 dark:text-slate-400 font-bold mb-1 tracking-wide">Status</p>
          <p class="font-bold text-sm text-slate-800 dark:text-slate-200 uppercase tracking-wider mt-1.5 ${isClosed?'text-qeRed dark:text-qeRed':''}">${isClosed?'Closed':t.status}</p>
        </div>
      </div>
      ${!isClosed ? `<button onclick="activeTab='payments'; render();" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 font-bold text-sm shadow-md active:scale-95 transition-all disp tracking-wide text-lg relative z-10">Register & Pay Now</button>` : ''}
    </div>`;
  });
  html += `</div>`;
  
  setTimeout(()=>{
    data.tournaments.forEach(t => { if(t.deadline) startCountdown(`timer-${t.id}`, t.deadline); });
  }, 100);

  return html;
}

function buildStandings(){
  let html = `<div class="flex justify-between items-center mb-6"><h2 class="disp text-2xl font-bold flex items-center gap-2 text-slate-900 dark:text-white"><i data-lucide="bar-chart-2" class="w-6 h-6 text-qeRed"></i> Leaderboards</h2>
  ${isAdmin ? `<button onclick="openStatForm()" class="bg-qeRed text-white px-4 py-2 rounded-xl text-xs font-bold active:scale-95 shadow-lg shadow-qeRed/30 transition-transform"><i data-lucide="plus" class="inline w-3 h-3"></i> Add Stats</button>` : `<button onclick="openStatForm()" class="bg-slate-800 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-xl text-xs font-bold active:scale-95 shadow-md">Submit Stats</button>`}
  </div>`;

  if(isAdmin) {
    const pStats = data.player_stats.filter(s=>s.status==='pending');
    if(pStats.length){
      html += `<div class="mb-6 p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 border border-indigo-200 dark:border-indigo-500/20"><h3 class="text-xs font-bold text-indigo-700 dark:text-indigo-400 mb-3 uppercase tracking-wider flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4"></i> Pending Stats</h3><div class="space-y-2.5">`;
      pStats.forEach(s=>{
        const pName = data.players.find(x=>x.id===s.player_id)?.name || 'Unknown';
        html += `<div class="flex justify-between items-center bg-white dark:bg-black/30 p-3 rounded-xl text-sm border border-indigo-100 dark:border-indigo-500/10"><div class="min-w-0"><span class="font-bold text-xs text-slate-800 dark:text-slate-200">${pName}</span><p class="text-[10px] text-slate-500 font-mono mt-0.5">K:${s.kills} | D:${s.damage} | S:${s.survived_minutes}m</p>${s.screenshot_url?`<a href="${s.screenshot_url}" target="_blank" class="text-[10px] text-indigo-600 dark:text-indigo-400 font-bold hover:underline mt-1 inline-flex items-center gap-1"><i data-lucide="image" class="w-3 h-3"></i> Proof</a>`:''}</div><div><button onclick="api('approve_stat',{id:'${s.id}'}).then(()=>{loadAll().then(render)})" class="text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 p-2 rounded-lg hover:bg-emerald-100 transition-colors mr-1.5"><i data-lucide="check" class="w-3.5 h-3.5"></i></button><button onclick="api('delete_stat',{id:'${s.id}'}).then(()=>{loadAll().then(render)})" class="text-qeRed bg-qeRed/10 border border-qeRed/20 p-2 rounded-lg hover:bg-qeRed/20 transition-colors"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div></div>`;
      });
      html += `</div></div>`;
    }
  }

  const pTotals = {};
  data.player_stats.filter(s=>s.status==='approved').forEach(s=>{
    if(!pTotals[s.player_id]) pTotals[s.player_id] = {k:0, d:0, s:0};
    pTotals[s.player_id].k += s.kills; pTotals[s.player_id].d += Number(s.damage); pTotals[s.player_id].s += Number(s.survived_minutes);
  });
  const mvps = Object.entries(pTotals).map(([id, st])=>({ id, pl: data.players.find(p=>p.id===id), ...st })).filter(x=>x.pl).sort((a,b)=>b.k - a.k || b.d - a.d);

  html += `<div class="glass border border-slate-200 dark:border-white/5 rounded-3xl p-6 mb-6 shadow-sm bg-white dark:bg-transparent"><h3 class="font-bold disp text-xl mb-5 text-emerald-600 dark:text-emerald-400 flex items-center gap-2"><i data-lucide="crosshair" class="w-5 h-5"></i> Top Fraggers (MVP)</h3>
  <div class="space-y-3">`;
  mvps.slice(0,10).forEach((m, i)=>{
    html += `<div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 p-3.5 rounded-2xl border border-slate-200 dark:border-white/5 hover:border-emerald-500/30 transition-colors"><div class="flex items-center gap-3.5"><span class="w-8 h-8 flex items-center justify-center rounded-xl font-bold disp text-lg ${i===0?'bg-gradient-to-br from-amber-400 to-amber-600 text-white shadow-lg shadow-amber-500/30':i===1?'bg-gradient-to-br from-slate-300 to-slate-400 text-slate-800 shadow-md':i===2?'bg-gradient-to-br from-orange-600 to-orange-800 text-white shadow-md':'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700'}">${i+1}</span><div><p class="font-bold text-sm text-slate-800 dark:text-slate-200 leading-tight">${m.pl.name}</p><p class="text-[10px] text-slate-500 font-mono mt-0.5">UID: ${m.pl.uid}</p></div></div><div class="text-right"><p class="font-bold text-qeRed text-2xl disp leading-none">${m.k} <span class="text-xs text-slate-400 font-bold uppercase tracking-widest ml-0.5">Kills</span></p><p class="text-[10px] text-slate-500 font-medium mt-1 bg-slate-200 dark:bg-slate-800 px-2 py-0.5 rounded-md inline-block">${m.d} DMG</p></div></div>`;
  });

function attachListeners(){
  if(activeTab==='payments'){
    const tourSel = document.getElementById('payTour');
    const updateCalc = () => {
      const opt = tourSel.options[tourSel.selectedIndex];
      if(!opt.value) return;
      const base = Number(opt.dataset.fee);
      const fee = Number((base * 0.0185).toFixed(2));
      const total = base + fee;
      document.getElementById('lblBase').innerText = `৳${base}`;
      document.getElementById('lblFee').innerText = `৳${fee}`;
      document.getElementById('lblTotal').innerText = `৳${total}`;
    };
    tourSel?.addEventListener('change', updateCalc);
    
    document.getElementById('payTeam')?.addEventListener('change', (e)=>{
      const tId = e.target.value; const prev = document.getElementById('teamPreview');
      if(!tId) { prev.classList.add('hidden'); return; }
      const pls = data.players.filter(p=>p.team_id===tId && p.status==='approved');
      prev.innerHTML = `<span class="font-bold text-[10px] uppercase tracking-wider text-indigo-600 dark:text-indigo-400 flex items-center gap-1"><i data-lucide="users" class="w-3 h-3"></i> Verified Players:</span><div class="mt-1 leading-relaxed">` + (pls.map(p=>`<span class="text-slate-800 dark:text-slate-200 font-semibold bg-white dark:bg-black/30 px-1.5 py-0.5 rounded border border-slate-200 dark:border-white/5 m-0.5 inline-block">${p.name} <span class="opacity-50 font-normal">(${p.uid})</span></span>`).join('') || '<span class="text-slate-500">No approved players</span>') + `</div>`;
      prev.classList.remove('hidden');
      lucide.createIcons();
    });

    const doSubmit = async (method) => {
      const btn = method==='auto' ? document.getElementById('autoVerifyBtn') : document.getElementById('manualVerifyBtn');
      const ogHtml = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Wait...'; lucide.createIcons();
      try {
        const tId = tourSel.value; const tmId = document.getElementById('payTeam').value;
        const name = document.getElementById('payName').value; const trx = document.getElementById('payTrx').value;
        const sNum = document.getElementById('paySender').value;
        if(!tId || !name) throw new Error('Tournament and Name required');
        if(method==='auto' && (!trx || !sNum)) throw new Error('TrxID and Sender Number required for Auto Verify');
        
        let screenshot_url = null;
        const fileInput = document.getElementById('payScreenshot');
        if(fileInput.files.length > 0) {
          screenshot_url = await uploadFileToSupabase('payment-proofs', 'payScreenshot');
        }

        const base = Number(tourSel.options[tourSel.selectedIndex].dataset.fee);
        const fee = Number((base * 0.0185).toFixed(2));
        await fetch('/api/payment-submit', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ tournament_id: tId, team_id: tmId, payer_name: name, base_amount: base, calculated_fee: fee, total_paid: base+fee, trx_id: trx, sender_number: sNum, screenshot_url, verify_method: method })
        }).then(async r=>{if(!r.ok) throw new Error((await r.json()).error);});
        showToast('Payment submitted successfully'); loadAll().then(render);
      } catch(e) { showToast(e.message,'error'); btn.innerHTML=ogHtml; lucide.createIcons(); }
    };
    document.getElementById('autoVerifyBtn')?.addEventListener('click', ()=>doSubmit('auto'));
    document.getElementById('manualVerifyBtn')?.addEventListener('click', ()=>doSubmit('manual'));
    document.getElementById('editNumbersBtn')?.addEventListener('click', openNumbersModal);
    
    document.querySelectorAll('.approve-pay-btn').forEach(b=> b.addEventListener('click', async e=>{
      try{ await api('approve_payment',{id:e.currentTarget.dataset.id}); await loadAll(); render(); showToast('Payment Approved'); }
      catch(err){ showToast(err.message,'error'); }
    }));
    document.querySelectorAll('.reject-pay-btn').forEach(b=> b.addEventListener('click', async e=>{
      try{ await api('reject_payment',{id:e.currentTarget.dataset.id}); await loadAll(); render(); showToast('Payment Rejected'); }
      catch(err){ showToast(err.message,'error'); }
    }));
  }
  
  if(activeTab==='teams'){
    document.getElementById('addTeamBtn')?.addEventListener('click', ()=> openTeamModal(null));
  }
  if(activeTab==='dashboard'){
    document.getElementById('editSettingsBtn')?.addEventListener('click', openAppSettingsModal);
  }
}

      <div><label class="text-[10px] font-bold uppercase text-slate-600 dark:text-slate-500 mb-1.5 block">Welcome Description</label><textarea id="as-desc" placeholder="Description" rows="3" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none text-slate-900 dark:text-white focus:border-qeRed/50 transition-colors leading-relaxed">${data.appSettings?.description||''}</textarea></div>

    <div class="flex gap-3 mt-8"><button onclick="hideModal()" class="flex-1 py-4 text-sm bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold">Cancel</button><button id="as-save" class="flex-1 py-4 text-sm bg-qeRed text-white rounded-xl font-bold shadow-lg shadow-qeRed/20 flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Save Settings</button></div>
  `);
  document.getElementById('as-save').onclick = async () => {
    const title = document.getElementById('as-title').value; const description = document.getElementById('as-desc').value;
    if(!title) return showToast('Title is required','error');
    try{ await api('update_app_settings', { title, description }); await loadAll(); hideModal(); render(); showToast('Settings updated'); }catch(e){showToast(e.message,'error');}
  };
};

window.openNumbersModal = () => {
  const nums = data.numbers?.length ? data.numbers : [{type:'Personal', number:''}];
  showModal(`
    <h3 class="font-bold disp text-xl mb-5 border-b border-slate-200 dark:border-white/10 pb-3"><i data-lucide="smartphone" class="inline w-5 h-5 text-qeRed mb-1"></i> Edit Payment Numbers</h3>
    <div id="numsList" class="space-y-3">
      ${nums.map((n,i)=>`<div class="flex gap-2 num-row fade-in">
        <select class="num-type bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-xs px-3 py-3 outline-none font-bold"><option ${n.type==='Personal'?'selected':''}>Personal</option><option ${n.type==='Agent'?'selected':''}>Agent</option><option ${n.type==='Merchant'?'selected':''}>Merchant</option></select>
        <input class="num-value flex-1 p-3 bg-slate-50 dark:bg-[#0a0a0f] border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-sm outline-none font-mono focus:border-qeRed/50 transition-colors" placeholder="017XXXXXXXX" value="${n.number||''}">
        <button class="num-remove text-slate-400 hover:text-qeRed bg-slate-100 dark:bg-slate-800/50 hover:bg-qeRed/10 rounded-xl px-4 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>`).join('')}
    </div>
    <button id="num-add" class="w-full mt-4 py-3 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-qeRed/50 dark:hover:border-qeRed/50 rounded-xl text-xs text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider transition-colors flex items-center justify-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Account</button>
    <div class="flex gap-3 mt-8"><button onclick="hideModal()" class="flex-1 py-4 text-sm bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold">Cancel</button><button id="num-save" class="flex-1 py-4 text-sm bg-qeRed text-white rounded-xl font-bold shadow-lg shadow-qeRed/20 flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Save</button></div>
  `);
  lucide.createIcons();
  document.getElementById('num-add').onclick = ()=>{
    const div = document.createElement('div'); div.className = 'flex gap-2 num-row mt-3 fade-in';
    div.innerHTML = `<select class="num-type bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-xs px-3 py-3 outline-none font-bold"><option>Personal</option><option>Agent</option><option>Merchant</option></select><input class="num-value flex-1 p-3 bg-slate-50 dark:bg-[#0a0a0f] border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-sm outline-none font-mono focus:border-qeRed/50" placeholder="017XXXXXXXX"><button class="num-remove text-slate-400 hover:text-qeRed bg-slate-100 dark:bg-slate-800/50 hover:bg-qeRed/10 rounded-xl px-4"><i data-lucide="x" class="w-4 h-4"></i></button>`;
    document.getElementById('numsList').appendChild(div); lucide.createIcons();
    div.querySelector('.num-remove').onclick = ()=> div.remove();
  };
  document.querySelectorAll('.num-remove').forEach(b=> b.onclick = e=> e.currentTarget.closest('.num-row').remove());
  document.getElementById('num-save').onclick = async ()=>{
    const numbers = Array.from(document.querySelectorAll('.num-row')).map(r=>({ type: r.querySelector('.num-type').value, number: r.querySelector('.num-value').value })).filter(n=>n.number);
    try{ await api('update_bkash_numbers', { numbers }); await loadAll(); hideModal(); render(); showToast('Numbers updated'); }catch(e){showToast(e.message,'error');}
  };
};

document.getElementById('themeToggleBtn').addEventListener('click', () => {
  const html = document.documentElement;
  if(html.classList.contains('dark')) { html.classList.remove('dark'); localStorage.setItem('qe_theme', 'light'); } 
  else { html.classList.add('dark'); localStorage.setItem('qe_theme', 'dark'); }
});

document.querySelectorAll('.nav-btn').forEach(btn=>{ btn.addEventListener('click', e=>{ activeTab = e.currentTarget.dataset.tab; localStorage.setItem('qe_tab', activeTab); const app = document.getElementById('app'); app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in'); render(); }); });

async function init(){
  try{ const cfg = await (await fetch('/api/config')).json(); supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey); } catch(e){ showToast('Config failed','error'); }
  await loadAll(); render();
}
init();
</script>
</body>
</html>
