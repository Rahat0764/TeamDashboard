<style>
  * { -webkit-tap-highlight-color: transparent; }
  html,body { background: #f8fafc; transition: background 0.4s ease; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  html.dark, html.dark body { background: #050508; }
  body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
  .disp { font-family: 'Rajdhani', sans-serif; letter-spacing: .02em; }
  .hide-scrollbar::-webkit-scrollbar { display: none; } 
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .cut-card { clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }

  .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-color: rgba(226, 232, 240, 0.8); }
  .dark .glass { background: rgba(19,19,25,0.85); border-color: rgba(255,255,255,0.05); }

  .mesh-lines { background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.04) 0 1px, transparent 1px 20px); }
  .dark .mesh-lines { background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.08) 0 1px, transparent 1px 20px); }

  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .fade-in { animation: fadeIn .4s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fadeIn { from {opacity: 0; transform: translateY(10px)} to {opacity: 1; transform: translateY(0)} }

  .toast-in { animation: toastIn .3s ease-out forwards; }
  @keyframes toastIn { from {opacity: 0; transform: translateX(110%)} to {opacity: 1; transform: translateX(0)} }

  ::selection { background: #c8203d; color: #fff; }

  .cropper-view-box,
  .cropper-face { border-radius: 50%; }
  .cropper-modal { background: rgba(0,0,0,0.8); }
  .rect-crop .cropper-view-box, .rect-crop .cropper-face { border-radius: 0; }
</style>
</head>

<div id="modalContainer" class="fixed inset-0 bg-slate-900/60 dark:bg-black/80 z-[100] hidden flex justify-center items-center px-4 backdrop-blur-md overflow-y-auto py-8 transition-all"></div>

<div id="imagePreviewModal" class="fixed inset-0 bg-slate-900/90 dark:bg-black/95 z-[200] hidden flex flex-col justify-center items-center px-4 backdrop-blur-lg overflow-y-auto transition-all">
  <div class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border border-slate-200 dark:border-white/10 flex flex-col items-center">
    <h3 class="font-bold disp text-xl mb-4 text-slate-900 dark:text-white" id="ipm-title">Crop Image</h3>
    <p class="text-[10px] text-slate-500 mb-3 uppercase tracking-widest font-bold"><i data-lucide="move" class="inline w-3 h-3"></i> Drag to move, Pinch/Scroll to zoom</p>
    <div id="ipm-canvas-container" class="w-full bg-slate-100 dark:bg-black/50 rounded-2xl flex items-center justify-center overflow-hidden mb-6 relative border border-slate-200 dark:border-white/5" style="height: 350px;">
      <img id="ipm-img" class="max-w-full max-h-full block" src="" alt="To Crop">
    </div>
    <div class="flex gap-3 w-full">
      <button onclick="window.closeImagePreview()" class="flex-1 py-4 text-sm bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold transition-colors">Cancel</button>
      <button id="ipm-confirm" class="flex-1 py-4 text-sm bg-qeRed text-white rounded-xl font-bold shadow-lg shadow-qeRed/30 flex items-center justify-center gap-2 hover:bg-qeRedDim transition-all"><i data-lucide="upload-cloud" class="w-4 h-4"></i> Confirm</button>
    </div>
  </div>
</div>
<div id="toast-container" class="fixed top-24 right-4 z-[300] flex flex-col gap-2 pointer-events-none"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

  window.supabase = null;
  window.activeTab = localStorage.getItem('qe_tab') || 'dashboard';
  window.adminToken = localStorage.getItem('qe_admin_token') || null;
  window.isAdmin = !!window.adminToken;
  window.data = { teams: [], matches: [], results: [], settings: null, payments: [], logs: [], numbers: [], appSettings: null, tournaments: [], players: [], player_stats: [] };
  window.timers = [];
  window.selectedPlayerCount = 1;
  let cropper = null;
  
  // Storage for pending blobs before final save
  window.pendingBlobs = {};
  window.pendingBucket = {};

  if (document.documentElement.classList.contains('dark')) {
      const slider = document.getElementById('themeSlider');
      if (slider) slider.classList.add('translate-x-6');
  }

  window.showToast = (msg, type='success') => {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    const colors = type==='success' ? 'bg-emerald-600 text-white' : (type==='error' ? 'bg-qeRed text-white' : 'bg-slate-800 text-white');
    t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl ${colors} text-sm font-bold max-w-xs border border-white/20 backdrop-blur-lg`;
    t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
    c.appendChild(t); lucide.createIcons();
    setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3200);
  };

  window.copyText = (text, label) => {
    const fallbackCopyText = (t, l) => {
      const ta = document.createElement('textarea'); ta.value = t;
      ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); window.showToast(`${l} copied!`); } 
      catch(err) { window.showToast('Failed to copy', 'error'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => window.showToast(`${label} copied!`)).catch(() => fallbackCopyText(text, label));
    } else {
      fallbackCopyText(text, label);
    }
  };

  window.showModal = (html) => {
    const mc = document.getElementById('modalContainer');
    mc.innerHTML = `<div class="bg-white/95 dark:bg-[#131319]/95 backdrop-blur-2xl w-full max-w-lg rounded-3xl p-6 border border-slate-200 dark:border-white/10 fade-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar text-slate-900 dark:text-white transition-colors">${html}</div>`;
    mc.classList.remove('hidden');
    lucide.createIcons();
    mc.onclick = (e) => { if(e.target === mc) window.hideModal(); };
  };

  window.hideModal = () => document.getElementById('modalContainer').classList.add('hidden');

  window.api = async (action, payload, isPublic = false) => {
    const endpoint = isPublic ? '/api/public-submit' : '/api/admin-write';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': window.adminToken || '' },
      body: JSON.stringify({ action, payload })
    });
    const json = await res.json();
    if(!res.ok){
      if(res.status === 401){ window.doLogout(); window.showToast('Session expired', 'error'); }
      throw new Error(json.error || 'Server error');
    }
    return json;
  }

  window.triggerImageUpload = (inputId, type) => {
    const input = document.getElementById(inputId);
    if (!input.files || input.files.length === 0) return;

    const file = input.files[0];
    if (file.size > 10 * 1024 * 1024) {
      window.showToast("File is too large! Maximum is 10MB.", "error");
      input.value = ""; return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('imagePreviewModal').classList.remove('hidden');
      const imgElem = document.getElementById('ipm-img');
      imgElem.src = e.target.result;

      const container = document.getElementById('ipm-canvas-container');
      if (cropper) { cropper.destroy(); }

      let cropOptions = {
        viewMode: 1, dragMode: 'move', autoCropArea: 0.9,
        cropBoxMovable: false, cropBoxResizable: false,
        zoomable: true, scalable: true, toggleDragModeOnDblclick: false,
      };

      if (type === 'avatar') {
        document.getElementById('ipm-title').innerText = "Crop Avatar / Logo";
        container.classList.remove('rect-crop');
        cropOptions.aspectRatio = 1;
      } else if (type === 'banner') {
        document.getElementById('ipm-title').innerText = "Crop Event Banner";
        container.classList.add('rect-crop');
        cropOptions.aspectRatio = 16 / 9;
      } else {
        document.getElementById('ipm-title').innerText = "Screenshot Proof Preview";
        container.classList.add('rect-crop');
        cropOptions.aspectRatio = NaN;
        cropOptions.cropBoxMovable = true;
        cropOptions.cropBoxResizable = true;
        cropOptions.autoCropArea = 1;
      }

      imgElem.onload = () => { cropper = new Cropper(imgElem, cropOptions); };

      const confirmBtn = document.getElementById('ipm-confirm');
      confirmBtn.innerHTML = '<i data-lucide="upload-cloud" class="w-4 h-4"></i> Confirm';
      lucide.createIcons();

      confirmBtn.onclick = async () => {
        const og = confirmBtn.innerHTML; confirmBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...'; lucide.createIcons();
        try {
          if (!cropper) throw new Error("Image not ready");
          const canvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200, imageSmoothingEnabled: true, imageSmoothingQuality: 'high' });

          canvas.toBlob((blob) => {
            const bucketName = type === 'avatar' ? 'player-avatars' : (type === 'banner' ? 'team-logos' : 'stat-proofs');
            window.pendingBlobs[inputId] = blob;
            window.pendingBucket[inputId] = bucketName;

            const previewUrl = URL.createObjectURL(blob);
            const btn = input.parentElement.querySelector('button');
            if (btn) {
              btn.innerHTML = `<img src="${previewUrl}" class="w-8 h-8 rounded-lg object-cover inline-block mr-2 align-middle border border-white/10"> <span class="align-middle">Selected — will upload on Save</span>`;
            }

            window.closeImagePreview();
            window.showToast("Image ready");
          }, 'image/jpeg', 0.85);
        } catch(err) {
          window.showToast(err.message, 'error');
          confirmBtn.innerHTML = og; lucide.createIcons();
        }
      };
    };
    reader.readAsDataURL(file);
  };

  window.closeImagePreview = () => {
    document.getElementById('imagePreviewModal').classList.add('hidden');
    if (cropper) { cropper.destroy(); cropper = null; }
  };

  window.uploadPendingBlob = async (inputId) => {
    const blob = window.pendingBlobs[inputId];
    if (!blob) return null;
    const bucketName = window.pendingBucket[inputId];
    const path = `${Date.now()}_${Math.random().toString(36).substring(2,9)}.jpeg`;
    const { error } = await window.supabase.storage.from(bucketName).upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    const { data: pubData } = window.supabase.storage.from(bucketName).getPublicUrl(path);
    delete window.pendingBlobs[inputId];
    delete window.pendingBucket[inputId];
    return pubData.publicUrl;
  };

  window.confirmAdminPassword = () => {
    return new Promise((resolve) => {
      window.showModal(`
        <div class="text-center mb-6"><div class="w-14 h-14 bg-qeRed/10 text-qeRed rounded-full flex items-center justify-center mx-auto mb-3 border border-qeRed/20"><i data-lucide="shield-alert" class="w-7 h-7"></i></div><h3 class="font-bold disp text-2xl text-slate-900 dark:text-white">Confirm Action</h3><p class="text-xs text-slate-600 dark:text-slate-400 mt-2">Enter admin password to continue</p></div>
        <input type="password" id="confirmPassInput" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-[#0a0a0f] border border-slate-200 dark:border-white/10 text-lg text-center tracking-widest font-mono outline-none text-slate-900 dark:text-white" placeholder="••••••••">
        <div class="flex gap-3 mt-6"><button id="cap-cancel" class="flex-1 py-4 text-sm bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold">Cancel</button><button id="cap-ok" class="flex-1 py-4 text-sm bg-qeRed text-white rounded-xl font-bold">Confirm</button></div>
      `);
      document.getElementById('cap-cancel').onclick = () => { window.hideModal(); resolve(false); };
      document.getElementById('cap-ok').onclick = async () => {
        const pw = document.getElementById('confirmPassInput').value;
        const btn = document.getElementById('cap-ok'); const og = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>'; lucide.createIcons();
        try {
          const res = await fetch('/api/admin-verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });
          if(!res.ok) throw new Error('Incorrect password');
          window.hideModal(); resolve(true);
        } catch(e) { window.showToast(e.message,'error'); btn.innerHTML = og; lucide.createIcons(); }
      };
    });
  };

  window.adminDelete = async (action, payload) => {
    const confirmed = await window.confirmAdminPassword();
    if (!confirmed) return;
    try {
      await window.api(action, payload);
      window.showToast('Deleted successfully');
      await window.loadAll();
      window.render();
    } catch(e) { window.showToast(e.message, 'error'); }
  };

  window.viewFullImage = (url) => {
    window.showModal(`<img src="${url}" class="w-full rounded-2xl object-contain">`);
  };

  window.loadAll = async () => {
    try {
      const res = await fetch('/api/get-data', { headers: { 'x-admin-token': window.adminToken || '' }});
      if(!res.ok) {
        if(res.status === 401) { window.doLogout(); return; }
        throw new Error("Failed to load data");
      }
      window.data = await res.json();
    } catch(e) { console.error(e); }
  }

  window.updateNav = () => {
    document.querySelectorAll('.nav-btn').forEach(b=>{
      if(b.dataset.tab === window.activeTab){ b.classList.add('text-qeRed'); b.classList.remove('text-slate-500', 'dark:text-slate-500'); }
      else { b.classList.remove('text-qeRed'); b.classList.add('text-slate-500', 'dark:text-slate-500'); }
    });
  }

  window.clearTimers = () => { window.timers.forEach(clearInterval); window.timers = []; }

  window.changeTab = (tab) => {
    window.activeTab = tab;
    localStorage.setItem('qe_tab', tab);
    const app = document.getElementById('app');
    app.classList.remove('fade-in'); void app.offsetWidth; app.classList.add('fade-in');
    window.render();
  };

  window.render = () => {
    window.clearTimers();
    window.selectedPlayerCount = 1;
    const app = document.getElementById('app');
    if(window.activeTab==='dashboard') app.innerHTML = window.buildDashboard();
    else if(window.activeTab==='tournaments') app.innerHTML = window.buildTournaments();
    else if(window.activeTab==='teams') app.innerHTML = window.buildTeams();
    else if(window.activeTab==='standings') app.innerHTML = window.buildStandings();
    else if(window.activeTab==='payments') app.innerHTML = window.buildPayments();
    else if(window.activeTab==='activity') app.innerHTML = window.buildActivity();
    lucide.createIcons();
    window.updateNav();
    document.getElementById('adminBtnText').innerText = window.isAdmin ? 'Logout' : 'Admin';
  }

  window.statCard = (label, value, icon, grad) => {
    return `<div class="cut-card ${grad} p-5 relative overflow-hidden shadow-lg border border-white/20 dark:border-white/5 transition-transform hover:-translate-y-1">
      <i data-lucide="${icon}" class="absolute -right-3 -bottom-3 w-24 h-24 text-white/20 dark:text-white/5"></i>

      const diff = target - now;
      if(diff <= 0) { clearInterval(timer); el.innerHTML = "Registration Closed"; return; }
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      el.innerHTML = `Ends in: <span class="text-white font-bold bg-qeRed/80 px-2 py-0.5 rounded-lg shadow-sm">${d}d ${h}h ${m}m</span>`;

  window.updateCalc = () => {
    const tourSel = document.getElementById('payTour');
    const payerSel = document.getElementById('payPayer');
    const hostCont = document.getElementById('hostCountContainer');

    if (!tourSel) return;
    const opt = tourSel.options[tourSel.selectedIndex];
    if(!opt || !opt.value) return;

    if(payerSel && payerSel.value === 'host') {
       hostCont.classList.remove('hidden');
    } else {
       window.selectedPlayerCount = 1;
       if(hostCont) hostCont.classList.add('hidden');
    }

    const basePerPlayer = Number(opt.dataset.fee) || 0;
    const base = basePerPlayer * window.selectedPlayerCount;
    const fee = Number((base * 0.0185).toFixed(2));
    const total = base + fee;

    document.getElementById('lblBase').innerText = `৳${base}`;
    document.getElementById('lblFee').innerText = `৳${fee}`;
    document.getElementById('lblTotal').innerText = `৳${total}`;
  };

  window.updateCountButtons = (count) => {
    window.selectedPlayerCount = count;
    document.querySelectorAll('.pay-count-btn').forEach(btn => {
      if(parseInt(btn.dataset.count) === count) {
         btn.className = 'pay-count-btn py-2.5 rounded-xl font-bold text-sm border transition-all bg-indigo-600 text-white border-indigo-600 shadow-md';
      } else {
         btn.className = 'pay-count-btn py-2.5 rounded-xl font-bold text-sm border transition-all bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-600 hover:bg-indigo-50 dark:hover:bg-slate-700';
      }
    });
    window.updateCalc();
  };

  window.onPayTeamChange = (e) => {
    const tId = e.target.value; 
    const payerCont = document.getElementById('payerContainer');
    const payerSel = document.getElementById('payPayer');

    if(!tId) { 
      payerCont.classList.add('hidden'); 
      return; 
    }

    const pls = window.data.players.filter(p=>p.team_id===tId && p.status==='approved');

    let optionsHTML = `<option value="">-- Choose Payer --</option>`;
    optionsHTML += `<option value="host" class="font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10">Host (Pay for multiple members)</option>`;

    if(pls.length > 0) {
       optionsHTML += `<optgroup label="Team Members">`;
       pls.forEach(p => {
         optionsHTML += `<option value="${p.name} (UID: ${p.uid})" class="text-slate-800 dark:text-slate-200 font-bold">${p.name} - UID: ${p.uid}</option>`;
       });
       optionsHTML += `</optgroup>`;
    } else {
       optionsHTML += `<option disabled>No approved players yet</option>`;
    }

    payerSel.innerHTML = optionsHTML;
    payerCont.classList.remove('hidden');
    payerSel.value = '';

  window.doPaymentSubmit = async (method) => {
    const btn = method==='auto' ? document.getElementById('autoVerifyBtn') : document.getElementById('manualVerifyBtn');
    const ogHtml = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Wait...'; lucide.createIcons();
    try {
      const tourSel = document.getElementById('payTour');
      const tId = tourSel.value;
      const tmId = document.getElementById('payTeam').value;
      const payerVal = document.getElementById('payPayer')?.value;
      const trx = document.getElementById('payTrx').value;
      const sNum = document.getElementById('paySender').value;

      if(!tId || !tmId) throw new Error('Tournament and Team are required');
      if(!payerVal) throw new Error('Please select who is paying');
      if(method==='auto' && (!trx || !sNum)) throw new Error('TrxID and Sender Number required for Auto Verify');

      let finalName = payerVal;
      if(payerVal === 'host') {
        const tName = window.data.teams.find(t=>t.id===tmId)?.team_name || 'Unknown Team';
        finalName = `Host (${window.selectedPlayerCount} Players) - ${tName}`;
      }

      const basePerPlayer = Number(tourSel.options[tourSel.selectedIndex].dataset.fee);
      const base = basePerPlayer * window.selectedPlayerCount;
      const fee = Number((base * 0.0185).toFixed(2));

      const uploadedUrl = await window.uploadPendingBlob('payScreenshot');

      const res = await fetch('/api/payment-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tournament_id: tId, team_id: tmId, payer_name: finalName, base_amount: base, calculated_fee: fee, total_paid: base+fee, trx_id: trx, sender_number: sNum, screenshot_url: uploadedUrl, verify_method: method })
      });
      const json = await res.json();
      if(!res.ok) throw new Error(json.error || 'Server error');
      window.showToast('Payment submitted successfully'); window.loadAll().then(window.render);
    } catch(e) { window.showToast(e.message,'error'); btn.innerHTML=ogHtml; lucide.createIcons(); }
  };

      if(!c1) return;
      const c2 = await window.confirmAdminPassword();
      if(!c2) return;
      try { await window.api('reset_all', {}); window.showToast('All data has been reset'); await window.loadAll(); window.hideModal(); window.render(); }
      catch(e){ window.showToast(e.message,'error'); }
    };
  };

  window.openNumbersModal = () => {
    const nums = window.data.numbers?.length ? window.data.numbers : [{type:'Personal', number:''}];
    window.showModal(`
      <h3 class="font-bold disp text-xl mb-5 border-b border-slate-200 dark:border-white/10 pb-3"><i data-lucide="smartphone" class="inline w-5 h-5 text-qeRed mb-1"></i> Edit Payment Numbers</h3>
      <div id="numsList" class="space-y-3">
        ${nums.map((n,i)=>`<div class="flex gap-2 num-row fade-in">
          <select class="num-type bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-xs px-3 py-3 outline-none font-bold appearance-none"><option ${n.type==='Personal'?'selected':''}>Personal</option><option ${n.type==='Agent'?'selected':''}>Agent</option><option ${n.type==='Merchant'?'selected':''}>Merchant</option></select>
          <input class="num-value flex-1 p-3 bg-slate-50 dark:bg-[#0a0a0f] border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-sm outline-none font-mono font-bold focus:border-qeRed/50 transition-colors" placeholder="017XXXXXXXX" value="${n.number||''}">
          <button onclick="this.closest('.num-row').remove()" class="num-remove text-slate-400 hover:text-qeRed bg-slate-100 dark:bg-slate-800/50 hover:bg-qeRed/10 rounded-xl px-4 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>`).join('')}
      </div>
      <button id="num-add" class="w-full mt-4 py-3 border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-qeRed/50 dark:hover:border-qeRed/50 rounded-xl text-xs text-slate-600 dark:text-slate-400 font-bold uppercase tracking-wider transition-colors flex items-center justify-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Account</button>
      <div class="flex gap-3 mt-8"><button onclick="window.hideModal()" class="flex-1 py-4 text-sm bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl font-bold">Cancel</button><button id="num-save" class="flex-1 py-4 text-sm bg-qeRed text-white rounded-xl font-bold shadow-lg shadow-qeRed/20 flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Save</button></div>
    `);
    lucide.createIcons();
    document.getElementById('num-add').onclick = ()=>{
      const div = document.createElement('div'); div.className = 'flex gap-2 num-row mt-3 fade-in';
      div.innerHTML = `<select class="num-type bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-xs px-3 py-3 outline-none font-bold appearance-none"><option>Personal</option><option>Agent</option><option>Merchant</option></select><input class="num-value flex-1 p-3 bg-slate-50 dark:bg-[#0a0a0f] border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl text-sm outline-none font-mono font-bold focus:border-qeRed/50" placeholder="017XXXXXXXX"><button onclick="this.closest('.num-row').remove()" class="num-remove text-slate-400 hover:text-qeRed bg-slate-100 dark:bg-slate-800/50 hover:bg-qeRed/10 rounded-xl px-4 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>`;
      document.getElementById('numsList').appendChild(div); lucide.createIcons();
    };
    document.getElementById('num-save').onclick = async ()=>{
      const btn = document.getElementById('num-save'); const og = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving...'; lucide.createIcons();
      const numbers = Array.from(document.querySelectorAll('.num-row')).map(r=>({ type: r.querySelector('.num-type').value, number: r.querySelector('.num-value').value })).filter(n=>n.number);
      try{ await window.api('update_bkash_numbers', { numbers }); await window.loadAll(); window.hideModal(); window.render(); window.showToast('Numbers updated'); }catch(e){window.showToast(e.message,'error'); btn.innerHTML=og; lucide.createIcons();}
    };
  };

  async function init(){
    try{ const cfg = await (await fetch('/api/config')).json(); window.supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey); } catch(e){ window.showToast('Config failed','error'); }
    await window.loadAll(); window.render();
  }

  // Start the application
  init();
</script>
</body>
</html>
