<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>QE Scrim | Pro Dashboard</title>
<meta name="theme-color" content="#0a0a0f">
<script>
  if (localStorage.getItem('qe_theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/logo-transparent.png">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: { display: ['"Rajdhani"','sans-serif'], body: ['"Inter"','"Hind Siliguri"','sans-serif'] },
    colors: { qeBg:'#0a0a0f', qeCard:'#131319', qeBorder:'#232330', qeRed:'#c8203d', qeRedDim:'#7a1428' }
  }}
}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html,body { background: #f1f5f9; transition: background 0.4s ease; height: 100dvh; overflow: hidden; }
  html.dark, html.dark body { background: #050508; }
  body { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
  .disp { font-family: 'Rajdhani', sans-serif; letter-spacing: .02em; }
  .hide-scrollbar::-webkit-scrollbar { display: none; } 
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .cut-card { clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  
  .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-color: rgba(255,255,255,0.3); }
  .dark .glass { background: rgba(19,19,25,0.7); border-color: rgba(255,255,255,0.05); }
  
  .mesh-lines { background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.04) 0 1px, transparent 1px 20px); }
  .dark .mesh-lines { background-image: repeating-linear-gradient(115deg, rgba(200,32,61,.08) 0 1px, transparent 1px 20px); }
  
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  
  .fade-in { animation: fadeIn .4s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fadeIn { from {opacity: 0; transform: translateY(10px)} to {opacity: 1; transform: translateY(0)} }
  
  .toast-in { animation: toastIn .3s ease-out forwards; }
  @keyframes toastIn { from {opacity: 0; transform: translateX(110%)} to {opacity: 1; transform: translateX(0)} }
  
  ::selection { background: #c8203d; color: #fff; }
</style>
</head>
<body class="text-slate-900 dark:text-slate-100 flex flex-col">

<header class="glass z-40 shrink-0 border-b px-4 py-3 relative mesh-lines transition-all duration-300 shadow-sm">
  <div class="max-w-6xl mx-auto flex justify-between items-center gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <img src="/assets/logo-transparent.png" class="w-10 h-10 object-contain drop-shadow-lg" alt="QE">
      <div class="min-w-0">
        <h1 class="disp text-xl font-bold text-slate-900 dark:text-white leading-none tracking-wide">QE <span class="text-qeRed">SCRIM</span></h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold tracking-widest uppercase">Platform</p>
      </div>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <button id="themeToggleBtn" class="relative w-12 h-6 rounded-full bg-slate-300 dark:bg-slate-700 transition-colors shadow-inner flex items-center p-1">
        <div class="w-4 h-4 rounded-full bg-white shadow-md transform transition-transform duration-300 dark:translate-x-6 flex items-center justify-center">
          <i data-lucide="sun" class="w-2.5 h-2.5 text-amber-500 dark:hidden"></i>
          <i data-lucide="moon" class="w-2.5 h-2.5 text-indigo-500 hidden dark:block"></i>
        </div>
      </button>
      <button id="adminBtn" class="flex items-center gap-1 text-xs font-bold text-qeRed bg-qeRed/10 px-3 py-1.5 rounded-full border border-qeRed/20 active:scale-95 transition-all hover:bg-qeRed hover:text-white">
        <i data-lucide="shield" class="w-3.5 h-3.5"></i> <span id="adminBtnText">Admin</span>
      </button>
    </div>
  </div>
</header>

<div id="main-scroll" class="flex-1 overflow-y-auto w-full pb-32 pt-5 px-4 md:px-6 hide-scrollbar relative">
  <main id="app" class="max-w-6xl mx-auto fade-in"></main>
</div>

<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[95%] max-w-md glass z-40 rounded-2xl border shadow-2xl transition-all duration-300">
  <div class="flex justify-around items-center h-16 px-2">
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider">Dash</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="tournaments"><i data-lucide="crosshair" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider">Events</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="teams"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider">Teams</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="standings"><i data-lucide="trophy" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider">Rank</span></button>
    <button class="nav-btn flex flex-col items-center gap-1 flex-1 py-1 transition-all" data-tab="payments"><i data-lucide="wallet" class="w-5 h-5"></i><span class="text-[9px] disp font-bold uppercase tracking-wider">Pay</span></button>
  </div>
</nav>

<div id="modalContainer" class="fixed inset-0 bg-slate-900/40 dark:bg-black/80 z-50 hidden flex justify-center items-center px-4 backdrop-blur-md overflow-y-auto py-8 transition-all"></div>
<div id="toast-container" class="fixed top-20 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

let supabase = null;
let activeTab = localStorage.getItem('qe_tab') || 'dashboard';
let adminToken = localStorage.getItem('qe_admin_token') || null;
let isAdmin = !!adminToken;

let data = { teams: [], matches: [], results: [], settings: null, payments: [], logs: [], numbers: [], appSettings: null, tournaments: [], players: [], player_stats: [] };
let timers = [];

const showToast = (msg, type='success') => {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const colors = type==='success' ? 'bg-emerald-600' : (type==='error' ? 'bg-qeRed' : 'bg-slate-800');
  t.className = `toast-in flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl text-white ${colors} text-sm font-semibold max-w-xs border border-white/20 backdrop-blur-lg`;
  t.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 shrink-0"></i><span>${msg}</span>`;
  c.appendChild(t); lucide.createIcons();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(20px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3200);
};

const showModal = (html) => {
  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="bg-white/90 dark:bg-[#131319]/90 backdrop-blur-xl w-full max-w-lg rounded-3xl p-6 border border-white/20 dark:border-white/5 fade-in shadow-2xl relative my-auto max-h-[85vh] overflow-y-auto hide-scrollbar text-slate-900 dark:text-white">${html}</div>`;
  mc.classList.remove('hidden');
  lucide.createIcons();
  mc.onclick = (e) => { if(e.target === mc) hideModal(); };
};
const hideModal = () => document.getElementById('modalContainer').classList.add('hidden');
window.hideModal = hideModal;

async function api(action, payload, isPublic = false) {
  const endpoint = isPublic ? '/api/public-submit' : '/api/admin-write';
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': adminToken || '' },
    body: JSON.stringify({ action, payload })
  });
  const json = await res.json();
  if(!res.ok){
    if(res.status === 401){ doLogout(); showToast('Session expired', 'error'); }
    throw new Error(json.error || 'Server error');
  }
  return json;
}

async function loadAll() {
  try {
    const [t, m, r, s, p, l, n, as, tr, pl, ps] = await Promise.all([
      supabase.from('teams').select('*').order('created_at'),
      supabase.from('matches').select('*').order('match_no'),
      supabase.from('match_results').select('*'),
      supabase.from('point_settings').select('*').eq('id',1).single(),
      supabase.from('payments').select('*').order('created_at', { ascending: false }),
      supabase.from('activity_logs').select('*').order('created_at', { ascending: false }).limit(40),
      supabase.from('bkash_numbers').select('*').eq('id',1).single(),
      supabase.from('app_settings').select('*').eq('id',1).single(),
      supabase.from('tournaments').select('*').order('created_at', {ascending: false}),
      supabase.from('players').select('*'),
      supabase.from('player_stats').select('*')
    ]);
    data = { 
      teams: t.data||[], matches: m.data||[], results: r.data||[], 
      settings: s.data||{kill_point_value:1, position_table:{}}, payments: p.data||[], 
      logs: l.data||[], numbers: n.data?.numbers||[], appSettings: as.data||null,
      tournaments: tr.data||[], players: pl.data||[], player_stats: ps.data||[]
    };
  } catch(e) { console.error(e); }
}

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if(b.dataset.tab === activeTab){ b.classList.add('text-qeRed'); b.classList.remove('text-slate-500', 'dark:text-slate-500'); }
    else { b.classList.remove('text-qeRed'); b.classList.add('text-slate-500', 'dark:text-slate-500'); }
  });
}

function clearTimers(){ timers.forEach(clearInterval); timers = []; }

function render(){
  clearTimers();
  const app = document.getElementById('app');
  if(activeTab==='dashboard') app.innerHTML = buildDashboard();
  else if(activeTab==='tournaments') app.innerHTML = buildTournaments();
  else if(activeTab==='teams') app.innerHTML = buildTeams();
  else if(activeTab==='standings') app.innerHTML = buildStandings();
  else if(activeTab==='payments') app.innerHTML = buildPayments();
  else if(activeTab==='activity') app.innerHTML = buildActivity();
  lucide.createIcons();
  attachListeners();
  updateNav();
  document.getElementById('adminBtnText').innerText = isAdmin ? 'Logout' : 'Admin';
}

function buildDashboard(){
  const tActive = data.tournaments.filter(x=>x.status==='active').length;
  const tPlayers = data.players.filter(x=>x.status==='approved').length;
  const html = `
  <div class="mb-6 cut-card mesh-lines bg-gradient-to-br from-qeRedDim/20 to-white dark:to-qeCard border border-white/40 dark:border-white/10 p-8 relative overflow-hidden shadow-xl">
    <img src="/assets/logo-transparent.png" class="absolute -right-10 -top-10 w-64 opacity-[0.05] dark:opacity-10 pointer-events-none mix-blend-overlay">
    <div class="relative z-10">
      <p class="text-qeRed font-bold text-[10px] uppercase tracking-[0.3em] mb-2 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-qeRed animate-pulse"></span> Live Platform</p>
      <h2 class="disp text-4xl font-bold text-slate-900 dark:text-white mb-3 drop-shadow-md">${data.appSettings?.title || 'QE SCRIM Dashboard'}</h2>
      <p class="text-sm text-slate-700 dark:text-slate-300 max-w-md leading-relaxed">${data.appSettings?.description || 'Manage events, standings, and automated payments.'}</p>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="glass p-5 rounded-2xl border shadow-sm relative overflow-hidden">
      <i data-lucide="crosshair" class="absolute -right-4 -bottom-4 w-24 h-24 text-indigo-500/10"></i>
      <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Active Events</p>
      <h3 class="text-3xl font-bold disp text-indigo-600 dark:text-indigo-400">${tActive}</h3>
    </div>
    <div class="glass p-5 rounded-2xl border shadow-sm relative overflow-hidden">
      <i data-lucide="users" class="absolute -right-4 -bottom-4 w-24 h-24 text-emerald-500/10"></i>
      <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Total Players</p>
      <h3 class="text-3xl font-bold disp text-emerald-600 dark:text-emerald-400">${tPlayers}</h3>
    </div>
  </div>`;
  return html;
}

function startCountdown(elementId, deadlineStr) {
  const el = document.getElementById(elementId);
  if(!el) return;
  const target = new Date(deadlineStr).getTime();
  const timer = setInterval(()=>{
    const now = new Date().getTime();
    const diff = target - now;
    if(diff <= 0) { clearInterval(timer); el.innerHTML = "Registration Closed"; return; }
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    el.innerHTML = `Ends in: <span class="text-qeRed font-bold">${d}d ${h}h ${m}m</span>`;
  }, 1000);
  timers.push(timer);
}

function buildTournaments(){
  let html = `<div class="flex justify-between items-center mb-6">
    <h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="crosshair" class="w-6 h-6 text-qeRed"></i> Tournaments</h2>
    ${isAdmin ? `<button id="addTourBtn" class="bg-qeRed text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-qeRed/30 active:scale-95"><i data-lucide="plus" class="inline w-3 h-3"></i> Add Event</button>` : ''}
  </div><div class="space-y-5">`;

  if(!data.tournaments.length) html += `<div class="glass p-10 text-center text-slate-500 rounded-3xl border">No active tournaments.</div>`;

  data.tournaments.forEach(t => {
    const isClosed = new Date(t.deadline).getTime() < new Date().getTime();
    html += `<div class="glass border rounded-3xl p-6 relative overflow-hidden group hover:shadow-xl transition-all">
      <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-qeRed/20 to-transparent blur-2xl rounded-full -mr-10 -mt-10"></div>
      ${isAdmin ? `<button class="absolute top-4 right-4 p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-500 hover:text-qeRed transition-colors z-10" onclick="editTour('${t.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i></button>` : ''}
      
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-qeRed/10 flex items-center justify-center text-qeRed"><i data-lucide="award" class="w-5 h-5"></i></div>
        <div>
          <h3 class="disp text-xl font-bold text-slate-900 dark:text-white leading-tight">${t.title}</h3>
          <p class="text-xs text-slate-500 font-medium mt-0.5" id="timer-${t.id}">${isClosed ? 'Registration Closed' : 'Loading...'}</p>
        </div>
      </div>
      <p class="text-sm text-slate-600 dark:text-slate-300 mb-5 whitespace-pre-line">${t.description || ''}</p>
      
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="bg-slate-50 dark:bg-black/20 p-3 rounded-2xl border border-slate-100 dark:border-white/5">
          <p class="text-[10px] uppercase text-slate-400 font-bold mb-1">Entry Fee</p>
          <p class="font-bold text-lg text-emerald-600 dark:text-emerald-400">৳${t.entry_fee}</p>
        </div>
        <div class="bg-slate-50 dark:bg-black/20 p-3 rounded-2xl border border-slate-100 dark:border-white/5">
          <p class="text-[10px] uppercase text-slate-400 font-bold mb-1">Status</p>
          <p class="font-bold text-sm text-slate-800 dark:text-slate-200 uppercase tracking-wide mt-1 ${isClosed?'text-qeRed':''}">${isClosed?'Closed':t.status}</p>
        </div>
      </div>
      ${!isClosed ? `<button onclick="activeTab='payments'; render();" class="w-full py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-sm shadow-md active:scale-95 transition-transform">Register & Pay Now</button>` : ''}
    </div>`;
  });
  html += `</div>`;
  
  setTimeout(()=>{
    data.tournaments.forEach(t => { if(t.deadline) startCountdown(`timer-${t.id}`, t.deadline); });
  }, 100);

  return html;
}

function buildTeams(){
  let html = `<div class="flex justify-between items-center mb-6">
    <h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="users" class="w-6 h-6 text-qeRed"></i> Teams</h2>
    <div class="flex gap-2">
      <button onclick="openPlayerForm()" class="bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white px-3 py-2 rounded-xl text-xs font-bold shadow-sm active:scale-95"><i data-lucide="user-plus" class="inline w-3 h-3"></i> Add Player</button>
      ${isAdmin ? `<button id="addTeamBtn" class="bg-qeRed text-white px-3 py-2 rounded-xl text-xs font-bold shadow-lg shadow-qeRed/30 active:scale-95"><i data-lucide="plus" class="inline w-3 h-3"></i> Team</button>` : ''}
    </div>
  </div>`;

  if(isAdmin) {
    const pendingPl = data.players.filter(p=>p.status==='pending');
    if(pendingPl.length){
      html += `<div class="mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20"><h3 class="text-xs font-bold text-amber-600 mb-3 uppercase tracking-wider">Pending Approvals</h3><div class="space-y-2">`;
      pendingPl.forEach(p=>{
        html += `<div class="flex justify-between items-center bg-white/50 dark:bg-black/20 p-2 rounded-lg text-sm"><span class="font-medium">${p.name} <span class="text-[10px] text-slate-500 ml-1">UID: ${p.uid}</span></span><div><button onclick="appPl('${p.id}')" class="text-emerald-500 bg-emerald-500/10 p-1.5 rounded mr-1"><i data-lucide="check" class="w-3 h-3"></i></button><button onclick="rejPl('${p.id}')" class="text-qeRed bg-qeRed/10 p-1.5 rounded"><i data-lucide="x" class="w-3 h-3"></i></button></div></div>`;
      });
      html += `</div></div>`;
    }
  }

  html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-5">`;
  data.teams.forEach(t=>{
    const pMain = data.players.filter(p=>p.team_id===t.id && p.role==='main' && p.status==='approved');
    const pBench = data.players.filter(p=>p.team_id===t.id && p.role==='bench' && p.status==='approved');
    
    html += `<div class="glass border rounded-3xl p-5 relative shadow-sm">
      ${isAdmin ? `<div class="absolute top-4 right-4 flex gap-1"><button class="p-2 bg-slate-100 dark:bg-slate-800 rounded-lg hover:text-qeRed transition" onclick="openTeamModal('${t.id}')"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button></div>` : ''}
      <div class="flex items-center gap-3 mb-5">
        <div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center font-bold disp text-xl shadow-inner">${t.slot_no||'?'}</div>
        <div><h3 class="font-bold text-xl disp text-slate-900 dark:text-white">${t.team_name}</h3><p class="text-[10px] text-slate-500 font-medium">MGR: ${t.manager_name||'None'}</p></div>
      </div>
      <div class="space-y-2 mb-4">
        ${pMain.map(p=>`<div class="flex items-center gap-3 bg-slate-50 dark:bg-black/20 p-2 rounded-xl border border-slate-100 dark:border-white/5"><img src="${p.avatar_url||'/assets/logo-transparent.png'}" class="w-8 h-8 rounded-lg object-cover bg-slate-200 dark:bg-slate-800"><div class="min-w-0"><p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">${p.name}</p><p class="text-[9px] text-slate-500 font-mono">UID: ${p.uid}</p></div></div>`).join('')}
      </div>
      ${pBench.length ? `<button onclick="document.getElementById('bench-${t.id}').classList.toggle('hidden')" class="text-[10px] w-full py-2 bg-slate-100 dark:bg-slate-800 rounded-lg font-bold text-slate-500 uppercase tracking-wider mb-2">Toggle Bench (${pBench.length})</button>
      <div id="bench-${t.id}" class="hidden space-y-2 mb-4">
        ${pBench.map(p=>`<div class="flex items-center gap-3 bg-amber-500/5 p-2 rounded-xl border border-amber-500/10"><img src="${p.avatar_url||'/assets/logo-transparent.png'}" class="w-8 h-8 rounded-lg object-cover bg-slate-200 dark:bg-slate-800 opacity-80"><div class="min-w-0"><p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">${p.name}</p><p class="text-[9px] text-slate-500 font-mono">UID: ${p.uid}</p></div></div>`).join('')}
      </div>` : ''}
    </div>`;
  });
  return html + `</div>`;
}

function buildPayments(){
  let html = `<h2 class="disp text-2xl font-bold flex items-center gap-2 mb-5"><i data-lucide="wallet" class="w-6 h-6 text-qeRed"></i> Payments</h2>`;
  
  html += `<div class="glass border rounded-3xl p-6 mb-6 shadow-sm">
    <h3 class="font-bold disp text-lg mb-4 flex items-center gap-2"><i data-lucide="send" class="w-5 h-5 text-qeRed"></i> Submit Payment</h3>
    <div class="space-y-4">
      <div>
        <label class="text-[10px] font-bold uppercase text-slate-500 mb-1.5 block">1. Select Tournament</label>
        <select id="payTour" class="w-full p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm outline-none font-medium"><option value="">-- Choose Event --</option>${data.tournaments.filter(x=>x.status==='active').map(t=>`<option value="${t.id}" data-fee="${t.entry_fee}">${t.title} (৳${t.entry_fee})</option>`).join('')}</select>
      </div>
      <div>
        <label class="text-[10px] font-bold uppercase text-slate-500 mb-1.5 block">2. Select Team</label>

function buildStandings(){
  let html = `<div class="flex justify-between items-center mb-6"><h2 class="disp text-2xl font-bold flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-6 h-6 text-qeRed"></i> Leaderboards</h2>
  ${isAdmin ? `<button onclick="openStatForm()" class="bg-qeRed text-white px-3 py-2 rounded-xl text-xs font-bold active:scale-95"><i data-lucide="plus" class="inline w-3 h-3"></i> Add Stats</button>` : `<button onclick="openStatForm()" class="bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-bold active:scale-95">Submit Stats</button>`}
  </div>`;

  if(isAdmin) {
    const pStats = data.player_stats.filter(s=>s.status==='pending');
    if(pStats.length){
      html += `<div class="mb-6 p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20"><h3 class="text-xs font-bold text-indigo-600 mb-3 uppercase tracking-wider">Pending Stats</h3><div class="space-y-2">`;
      pStats.forEach(s=>{
        const pName = data.players.find(x=>x.id===s.player_id)?.name || 'Unknown';
        html += `<div class="flex justify-between items-center bg-white/50 dark:bg-black/20 p-2 rounded-lg text-sm"><div class="min-w-0"><span class="font-bold text-xs">${pName}</span><p class="text-[10px] text-slate-500">K:${s.kills} | D:${s.damage} | S:${s.survived_minutes}m</p>${s.screenshot_url?`<a href="${s.screenshot_url}" target="_blank" class="text-[9px] text-indigo-500 underline mt-0.5 inline-block">Proof</a>`:''}</div><div><button onclick="api('approve_stat',{id:'${s.id}'}).then(()=>{loadAll().then(render)})" class="text-emerald-500 p-1"><i data-lucide="check" class="w-4 h-4"></i></button><button onclick="api('delete_stat',{id:'${s.id}'}).then(()=>{loadAll().then(render)})" class="text-qeRed p-1"><i data-lucide="x" class="w-4 h-4"></i></button></div></div>`;
      });
      html += `</div></div>`;
    }
  }

  // MVP Calc
  const pTotals = {};
  data.player_stats.filter(s=>s.status==='approved').forEach(s=>{
    if(!pTotals[s.player_id]) pTotals[s.player_id] = {k:0, d:0, s:0};
    pTotals[s.player_id].k += s.kills; pTotals[s.player_id].d += Number(s.damage); pTotals[s.player_id].s += Number(s.survived_minutes);
  });
  const mvps = Object.entries(pTotals).map(([id, st])=>({ id, pl: data.players.find(p=>p.id===id), ...st })).filter(x=>x.pl).sort((a,b)=>b.k - a.k || b.d - a.d);

  html += `<div class="glass border rounded-3xl p-5 mb-6"><h3 class="font-bold disp text-lg mb-4 text-emerald-600 dark:text-emerald-400"><i data-lucide="crosshair" class="inline w-4 h-4"></i> Top Fraggers (MVP)</h3>
  <div class="space-y-2">`;
  mvps.slice(0,10).forEach((m, i)=>{
    html += `<div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-white/5"><div class="flex items-center gap-3"><span class="w-6 h-6 flex items-center justify-center rounded-md font-bold text-xs ${i===0?'bg-amber-500 text-white shadow-md':i===1?'bg-slate-300 text-slate-800':i===2?'bg-orange-700 text-white':'bg-slate-200 dark:bg-slate-800 text-slate-500'}">${i+1}</span><div><p class="font-bold text-sm text-slate-800 dark:text-slate-200 leading-tight">${m.pl.name}</p><p class="text-[9px] text-slate-500 font-mono">UID: ${m.pl.uid}</p></div></div><div class="text-right"><p class="font-bold text-qeRed text-lg disp leading-none">${m.k} <span class="text-[10px] text-slate-400 font-normal">Kills</span></p><p class="text-[9px] text-slate-500 font-medium">${m.d} Dmg</p></div></div>`;
  });
  if(!mvps.length) html += `<p class="text-xs text-center text-slate-500 py-4">No verified stats yet.</p>`;
  html += `</div></div>`;

  return html;
}

function buildActivity(){ return `<div class="p-8 text-center text-slate-500">Activity Logs (Code hidden for brevity, same as previous)</div>`; }

function attachListeners(){
  if(activeTab==='payments'){
    const tourSel = document.getElementById('payTour');
    const updateCalc = () => {
      const opt = tourSel.options[tourSel.selectedIndex];
      if(!opt.value) return;
      const base = Number(opt.dataset.fee);
      const fee = Number((base * 0.0185).toFixed(2));
      const total = base + fee;
      document.getElementById('lblBase').innerText = `৳${base}`;
      document.getElementById('lblFee').innerText = `৳${fee}`;
      document.getElementById('lblTotal').innerText = `৳${total}`;
    };
    tourSel?.addEventListener('change', updateCalc);
    
    document.getElementById('payTeam')?.addEventListener('change', (e)=>{
      const tId = e.target.value; const prev = document.getElementById('teamPreview');
      if(!tId) { prev.classList.add('hidden'); return; }
      const pls = data.players.filter(p=>p.team_id===tId && p.status==='approved');
      prev.innerHTML = `<span class="font-bold text-[10px] uppercase text-indigo-500">Players:</span><br>` + (pls.map(p=>`<span class="text-slate-700 dark:text-slate-300">${p.name} <span class="opacity-50">(${p.uid})</span></span>`).join(', ') || 'No approved players');
      prev.classList.remove('hidden');
    });

    const doSubmit = async (method) => {
      const btn = method==='auto' ? document.getElementById('autoVerifyBtn') : document.getElementById('manualVerifyBtn');
      const ogHtml = btn.innerHTML; btn.innerHTML = 'Wait...';
      try {
        const tId = tourSel.value; const tmId = document.getElementById('payTeam').value;
        const name = document.getElementById('payName').value; const trx = document.getElementById('payTrx').value;
        const sNum = document.getElementById('paySender').value;
        if(!tId || !name) throw new Error('Tournament and Name required');
        if(method==='auto' && (!trx || !sNum)) throw new Error('TrxID and Number required for auto verify');
        
        const base = Number(tourSel.options[tourSel.selectedIndex].dataset.fee);
        const fee = Number((base * 0.0185).toFixed(2));
        await fetch('/api/payment-submit', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ tournament_id: tId, team_id: tmId, payer_name: name, base_amount: base, calculated_fee: fee, total_paid: base+fee, trx_id: trx, sender_number: sNum, verify_method: method })
        }).then(async r=>{if(!r.ok) throw new Error((await r.json()).error);});
        showToast('Submitted successfully'); loadAll().then(render);
      } catch(e) { showToast(e.message,'error'); btn.innerHTML=ogHtml; }
    };
    document.getElementById('autoVerifyBtn')?.addEventListener('click', ()=>doSubmit('auto'));
    document.getElementById('manualVerifyBtn')?.addEventListener('click', ()=>doSubmit('manual'));
  }
}
